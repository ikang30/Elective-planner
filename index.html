<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Elect! — Year 10 Planner</title>

  <!-- Supabase JS -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
  <!-- React + Babel -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <!-- Icons -->
  <script src="https://unpkg.com/feather-icons/dist/feather.min.js"></script>

  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --primary:       #6366f1;
      --primary-light: #818cf8;
      --primary-dark:  #4338ca;
      --accent:        #f59e0b;
      --success:       #10b981;
      --danger:        #ef4444;
      --bg:            #f8fafc;
      --surface:       #ffffff;
      --surface2:      #f1f5f9;
      --border:        #e2e8f0;
      --text:          #1e293b;
      --text-muted:    #64748b;
      --radius:        14px;
      --shadow:        0 4px 24px rgba(99,102,241,.10);
      --shadow-lg:     0 8px 40px rgba(99,102,241,.16);
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif;
      background: var(--bg); color: var(--text); min-height: 100vh;
    }
    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 99px; }

    #root { min-height: 100vh; display: flex; flex-direction: column; }
    .app-shell { display: flex; flex-direction: column; min-height: 100vh; }

    /* ═══ AUTH SCREEN ═══ */
    .auth-bg {
      min-height: 100vh; display: flex; align-items: center; justify-content: center;
      background: linear-gradient(135deg, #eef2ff 0%, #f5f3ff 50%, #fdf2f8 100%);
      padding: 1.5rem;
    }
    .auth-card {
      background: var(--surface); border-radius: 20px;
      box-shadow: 0 20px 60px rgba(99,102,241,.15);
      padding: 2.5rem; width: 100%; max-width: 420px;
    }
    .auth-logo {
      display: flex; align-items: center; gap: .6rem;
      justify-content: center; margin-bottom: 1.75rem;
    }
    .auth-logo-icon {
      width: 44px; height: 44px; background: var(--primary);
      border-radius: 12px; display: grid; place-items: center;
    }
    .auth-logo-text {
      font-size: 1.9rem; font-weight: 900; color: var(--primary);
      letter-spacing: -.03em;
    }
    .auth-tabs { display: flex; background: var(--surface2); border-radius: 10px; padding: .25rem; margin-bottom: 1.75rem; }
    .auth-tab {
      flex: 1; padding: .55rem; border-radius: 8px; border: none;
      font-size: .9rem; font-weight: 600; cursor: pointer;
      background: transparent; color: var(--text-muted); transition: all .18s;
    }
    .auth-tab.active { background: var(--surface); color: var(--primary); box-shadow: 0 2px 8px rgba(0,0,0,.08); }
    .auth-field { display: flex; flex-direction: column; gap: .35rem; margin-bottom: 1rem; }
    .auth-label { font-size: .83rem; font-weight: 600; color: var(--text); }
    .auth-input {
      padding: .65rem .9rem; border: 1.5px solid var(--border);
      border-radius: 9px; font-size: .92rem; color: var(--text);
      background: var(--surface); outline: none;
      transition: border-color .15s, box-shadow .15s; width: 100%;
    }
    .auth-input:focus { border-color: var(--primary); box-shadow: 0 0 0 3px rgba(99,102,241,.12); }
    .auth-btn {
      width: 100%; padding: .72rem; border-radius: 10px; border: none;
      background: var(--primary); color: #fff; font-size: .95rem; font-weight: 700;
      cursor: pointer; transition: all .18s; margin-top: .25rem;
    }
    .auth-btn:hover { background: var(--primary-dark); transform: translateY(-1px); box-shadow: 0 4px 16px rgba(99,102,241,.3); }
    .auth-btn:disabled { opacity: .6; cursor: not-allowed; transform: none; box-shadow: none; }
    .auth-error {
      background: #fff1f2; border: 1.5px solid #fecdd3; border-radius: 9px;
      padding: .6rem .85rem; font-size: .84rem; color: var(--danger); margin-bottom: 1rem;
    }
    .auth-success {
      background: #ecfdf5; border: 1.5px solid #6ee7b7; border-radius: 9px;
      padding: .6rem .85rem; font-size: .84rem; color: #065f46; margin-bottom: 1rem;
    }
    .auth-divider { text-align: center; color: var(--text-muted); font-size: .8rem; margin: 1rem 0; }

    /* ═══ LOADING SCREEN ═══ */
    .loading-screen {
      min-height: 100vh; display: flex; flex-direction: column;
      align-items: center; justify-content: center; gap: 1rem;
    }
    .spinner {
      width: 36px; height: 36px; border-radius: 50%;
      border: 3px solid var(--border); border-top-color: var(--primary);
      animation: spin .7s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .loading-text { font-size: .9rem; color: var(--text-muted); font-weight: 500; }

    /* ═══ SCHOOL SPLASH SIGN ═══ */
    .school-splash-overlay {
      position: fixed; inset: 0; z-index: 1200; pointer-events: none;
      display: grid; place-items: center;
      background: transparent;
      animation: schoolSplashFade 3.2s ease forwards;
    }
    .school-neon-sign {
      width: min(820px, calc(100vw - 2rem));
      color: #fef08a; text-align: center;
      font-size: clamp(1.65rem, 4.4vw, 3.65rem);
      font-weight: 950; letter-spacing: 0; line-height: 1.08;
      text-shadow:
        0 0 2px #fff7ad,
        0 0 4px #fef9c3,
        0 0 11px #fde047,
        0 0 24px #facc15,
        0 0 46px #eab308,
        0 0 70px rgba(234,179,8,.75);
      animation: neonPop 3.2s ease forwards, neonFlicker 1.25s steps(2, end) infinite;
    }
    @keyframes neonPop {
      0% { opacity: 0; transform: scale(.72) rotate(-1.5deg); }
      12% { opacity: 1; transform: scale(1.04) rotate(.8deg); }
      20%, 78% { opacity: 1; transform: scale(1) rotate(0); }
      100% { opacity: 0; transform: scale(.96) translateY(-12px); }
    }
    @keyframes schoolSplashFade {
      0%, 78% { opacity: 1; }
      100% { opacity: 0; visibility: hidden; }
    }
    @keyframes neonFlicker {
      0%, 18%, 22%, 100% { filter: brightness(1); }
      20% { filter: brightness(1.35); }
      70% { filter: brightness(.92); }
    }

    /* ═══ NAV ═══ */
    .nav {
      position: sticky; top: 0; z-index: 100;
      background: rgba(255,255,255,.88); backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--border);
      padding: 0 2rem; display: flex; align-items: center; gap: 1.5rem; height: 64px;
    }
    .nav-logo {
      display: flex; align-items: center; gap: .45rem;
      font-weight: 900; font-size: 1.3rem; color: var(--primary);
      text-decoration: none; flex-shrink: 0; letter-spacing: -.02em;
    }
    .nav-logo .logo-icon {
      width: 32px; height: 32px; background: var(--primary);
      border-radius: 8px; display: grid; place-items: center;
    }
    .nav-links { display: flex; gap: .25rem; flex: 1; }
    .nav-link {
      padding: .45rem .9rem; border-radius: 8px; font-size: .88rem; font-weight: 500;
      cursor: pointer; border: none; background: transparent;
      color: var(--text-muted); transition: all .18s; white-space: nowrap;
    }
    .nav-link:hover { background: var(--surface2); color: var(--text); }
    .nav-link.active { background: var(--primary); color: #fff; }
    .nav-link.coming-soon { opacity: .35; cursor: not-allowed; font-size: .78rem; }
    .nav-badge {
      margin-left: .35rem; font-size: .68rem; font-weight: 700;
      background: var(--accent); color: #fff;
      padding: .1rem .4rem; border-radius: 99px; vertical-align: middle;
    }
    /* User badge in nav */
    .nav-user {
      display: flex; align-items: center; gap: .6rem;
      margin-left: auto; flex-shrink: 0;
    }
    .nav-avatar {
      width: 32px; height: 32px; border-radius: 50%;
      background: var(--primary); color: #fff;
      display: grid; place-items: center; font-size: .8rem; font-weight: 700;
      flex-shrink: 0;
    }
    .nav-email { font-size: .82rem; color: var(--text-muted); max-width: 160px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .nav-logout {
      padding: .35rem .75rem; border-radius: 7px;
      border: 1.5px solid var(--border); background: transparent;
      font-size: .8rem; color: var(--text-muted); cursor: pointer;
      transition: all .15s; white-space: nowrap;
    }
    .nav-logout:hover { border-color: var(--danger); color: var(--danger); background: #fff1f2; }

    /* Save indicator */
    .save-indicator {
      font-size: .75rem; color: var(--success); font-weight: 600;
      display: flex; align-items: center; gap: .3rem;
      animation: fadeIn .3s ease;
    }
    @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

    /* ═══ PAGE ═══ */
    .page { flex: 1; padding: 2.5rem 2rem; max-width: 1120px; margin: 0 auto; width: 100%; }
    .page-header { margin-bottom: 2rem; }
    .page-title { font-size: 1.9rem; font-weight: 800; line-height: 1.2; }
    .page-subtitle { margin-top: .4rem; color: var(--text-muted); font-size: .97rem; }

    /* ═══ CARDS ═══ */
    .card {
      background: var(--surface); border: 1px solid var(--border);
      border-radius: var(--radius); padding: 1.5rem; box-shadow: var(--shadow);
    }
    .card + .card { margin-top: 1.25rem; }
    .card-title {
      font-size: .97rem; font-weight: 700; margin-bottom: 1rem;
      display: flex; align-items: center; gap: .5rem;
    }
    .icon-wrap {
      width: 28px; height: 28px; border-radius: 8px;
      display: grid; place-items: center; flex-shrink: 0;
    }

    /* ═══ FORM ═══ */
    .form-two-col { display: grid; grid-template-columns: 1fr 1fr; gap: 1.25rem; margin-top: 1.25rem; }
    .form-select, .form-input {
      padding: .6rem .9rem; border: 1.5px solid var(--border);
      border-radius: 8px; font-size: .91rem; color: var(--text);
      background: var(--surface); outline: none; width: 100%; appearance: none;
      transition: border-color .15s, box-shadow .15s;
    }
    .form-select:focus, .form-input:focus {
      border-color: var(--primary); box-shadow: 0 0 0 3px rgba(99,102,241,.12);
    }
    .grade-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: .75rem; }
    .grade-cell { display: flex; flex-direction: column; gap: .3rem; }
    .grade-cell label { font-size: .78rem; color: var(--text-muted); font-weight: 600; }

    /* ═══ DESIRED ELECTIVES ═══ */
    .desired-elective-row { display: flex; gap: .5rem; margin-bottom: .5rem; }
    .desired-elective-row select { flex: 1; }
    .remove-btn {
      width: 34px; height: 34px; border-radius: 8px; border: 1.5px solid var(--border);
      background: transparent; cursor: pointer; display: grid; place-items: center;
      color: var(--text-muted); transition: all .15s; flex-shrink: 0;
    }
    .remove-btn:hover { border-color: var(--danger); color: var(--danger); background: #fff1f2; }
    .add-elective-btn {
      display: inline-flex; align-items: center; gap: .4rem;
      padding: .42rem .85rem; border-radius: 8px; border: 1.5px dashed var(--border);
      background: transparent; cursor: pointer; font-size: .83rem; color: var(--text-muted);
      transition: all .15s; margin-top: .3rem;
    }
    .add-elective-btn:hover { border-color: var(--primary); color: var(--primary); background: rgba(99,102,241,.04); }

    /* ═══ UNI SECTIONS ═══ */
    .uni-section-label {
      font-size: .72rem; font-weight: 800; text-transform: uppercase;
      letter-spacing: .08em; color: var(--text-muted);
      margin: .9rem 0 .5rem; display: flex; align-items: center; gap: .5rem;
    }
    .uni-section-label::after { content: ''; flex: 1; height: 1px; background: var(--border); }
    .multi-chip-grid { display: flex; flex-wrap: wrap; gap: .45rem; }
    .multi-chip {
      padding: .32rem .8rem; border-radius: 99px; border: 1.5px solid var(--border);
      font-size: .8rem; font-weight: 500; cursor: pointer; transition: all .15s;
      background: var(--surface); color: var(--text-muted);
    }
    .multi-chip:hover { border-color: var(--primary-light); color: var(--primary); }
    .multi-chip.selected { border-color: var(--primary); background: var(--primary); color: #fff; }
    .multi-chip.chip-disabled { opacity: .35; cursor: not-allowed; pointer-events: none; }

    /* ═══ BUTTONS ═══ */
    .btn {
      display: inline-flex; align-items: center; gap: .5rem;
      padding: .65rem 1.4rem; border-radius: 10px; font-size: .92rem; font-weight: 600;
      cursor: pointer; border: none; transition: all .18s;
    }
    .btn-primary { background: var(--primary); color: #fff; }
    .btn-primary:hover { background: var(--primary-dark); transform: translateY(-1px); box-shadow: 0 4px 16px rgba(99,102,241,.3); }
    .btn-secondary { background: var(--surface2); color: var(--text); border: 1.5px solid var(--border); }
    .btn-secondary:hover { background: var(--border); }
    .btn-lock { background: linear-gradient(135deg, var(--success), #059669); color: #fff; border: none; box-shadow: 0 4px 14px rgba(16,185,129,.3); }
    .btn-lock:hover { filter: brightness(1.08); transform: translateY(-1px); box-shadow: 0 6px 18px rgba(16,185,129,.4); }
    .submit-row { margin-top: 1.5rem; display: flex; gap: .75rem; align-items: center; }

    /* ═══ REQUIREMENT BARS ═══ */
    .req-bars { display: flex; gap: .75rem; flex-wrap: wrap; margin-bottom: 1.25rem; }
    .req-bar { flex: 1; min-width: 140px; background: var(--surface2); border-radius: 10px; padding: .65rem .9rem; }
    .req-bar-label { font-size: .76rem; color: var(--text-muted); margin-bottom: .35rem; }
    .req-bar-track { height: 6px; background: var(--border); border-radius: 99px; overflow: hidden; }
    .req-bar-fill { height: 100%; border-radius: 99px; transition: width .4s ease; }
    .req-bar-count { font-size: .8rem; font-weight: 700; margin-top: .3rem; }

    /* ═══ INFO / LOCKED BANNERS ═══ */
    .info-banner {
      background: rgba(99,102,241,.07); border: 1.5px solid rgba(99,102,241,.2);
      border-radius: 10px; padding: .7rem 1rem; font-size: .84rem; color: var(--primary);
      margin-bottom: 1.25rem; display: flex; align-items: center; gap: .6rem;
    }
    .accuracy-warning {
      background: linear-gradient(135deg, #fffbeb, #fff7ed);
      border: 1.5px solid #fbbf24; border-radius: 12px;
      padding: .85rem 1rem; margin-bottom: 1.25rem;
      display: flex; align-items: flex-start; gap: .7rem;
      color: #92400e; box-shadow: 0 4px 18px rgba(245,158,11,.12);
    }
    .accuracy-warning strong { display: block; font-size: .9rem; margin-bottom: .18rem; color: #78350f; }
    .accuracy-warning span { font-size: .82rem; line-height: 1.5; }
    .locked-banner {
      background: linear-gradient(135deg, #ecfdf5, #f0fdf4);
      border: 1.5px solid #6ee7b7; border-radius: 12px;
      padding: .85rem 1.1rem; margin-bottom: 1.25rem;
      display: flex; align-items: center; gap: .75rem;
      font-size: .88rem; font-weight: 600; color: #065f46;
    }

    /* ═══ LOCK / RESTART ACTIONS ═══ */
    .lock-action-row { margin-top: 1.5rem; display: flex; gap: .75rem; align-items: center; flex-wrap: wrap; }
    .restart-confirm {
      background: #fff1f2; border: 1.5px solid #fecdd3; border-radius: 10px;
      padding: .65rem 1rem; display: flex; align-items: center; gap: .75rem;
      font-size: .85rem; color: var(--danger); font-weight: 500;
    }
    .restart-confirm-btns { display: flex; gap: .4rem; }
    .btn-confirm-yes {
      padding: .3rem .8rem; border-radius: 7px; background: var(--danger); color: #fff;
      border: none; cursor: pointer; font-size: .82rem; font-weight: 600; transition: all .15s;
    }
    .btn-confirm-yes:hover { background: #dc2626; }
    .btn-confirm-no {
      padding: .3rem .8rem; border-radius: 7px; background: var(--surface2); color: var(--text);
      border: 1.5px solid var(--border); cursor: pointer; font-size: .82rem; font-weight: 600; transition: all .15s;
    }
    .btn-confirm-no:hover { background: var(--border); }

    /* ═══ SUGGESTION CARDS ═══ */
    .suggestions-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 1.1rem; }
    .suggestion-card {
      border: 1.5px solid var(--border); border-radius: var(--radius);
      background: var(--surface); padding: 1.2rem; box-shadow: var(--shadow);
      transition: box-shadow .2s, transform .2s;
      animation: fadeSlideIn .3s ease forwards;
    }
    .suggestion-card:hover { box-shadow: var(--shadow-lg); transform: translateY(-2px); }
    @keyframes fadeSlideIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    .suggestion-card.dismissed { animation: swipeOut .28s ease forwards; }
    @keyframes swipeOut { to { opacity: 0; transform: translateX(60px) scale(.95); } }
    .sug-header { display: flex; align-items: flex-start; justify-content: space-between; gap: .5rem; margin-bottom: .65rem; }
    .sug-subject-name { font-size: 1rem; font-weight: 700; line-height: 1.25; }
    .sug-category-badge { font-size: .7rem; font-weight: 700; padding: .18rem .55rem; border-radius: 99px; white-space: nowrap; flex-shrink: 0; margin-top: .1rem; }
    .sug-description { font-size: .83rem; color: var(--text-muted); line-height: 1.55; margin-bottom: .75rem; }
    .sug-footer { display: flex; align-items: center; justify-content: space-between; }
    .sug-unit-badge { font-size: .74rem; color: var(--text-muted); display: flex; align-items: center; gap: .3rem; }
    .dismiss-btn {
      display: inline-flex; align-items: center; gap: .35rem;
      padding: .32rem .75rem; border-radius: 8px; border: 1.5px solid var(--border);
      background: transparent; cursor: pointer; font-size: .79rem; color: var(--text-muted); transition: all .15s;
    }
    .dismiss-btn:hover { border-color: var(--danger); color: var(--danger); background: #fff1f2; }
    .restore-btn {
      display: inline-flex; align-items: center; gap: .35rem;
      padding: .32rem .75rem; border-radius: 8px; border: 1.5px solid #bbf7d0;
      background: #ecfdf5; cursor: pointer; font-size: .79rem; color: #047857; transition: all .15s;
    }
    .restore-btn:hover { border-color: var(--success); background: #d1fae5; }
    .essential-panel, .manual-panel {
      background: var(--surface); border: 1.5px solid var(--border);
      border-radius: 12px; padding: 1rem 1.1rem; margin-top: 1.25rem; box-shadow: var(--shadow);
    }
    .essential-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: .9rem; margin-top: .75rem; }
    .essential-title { font-size: .78rem; font-weight: 800; color: var(--text-muted); margin-bottom: .45rem; text-transform: uppercase; letter-spacing: .04em; }
    .essential-options { display: flex; flex-wrap: wrap; gap: .35rem; }
    .essential-chip {
      padding: .3rem .65rem; border-radius: 999px; border: 1.5px solid var(--border);
      background: var(--surface); color: var(--text-muted); font-size: .78rem; font-weight: 600; cursor: pointer;
    }
    .essential-chip:hover { border-color: var(--primary); color: var(--primary); }
    .essential-chip.active { background: var(--primary); border-color: var(--primary); color: #fff; }
    .manual-panel-header { display: flex; justify-content: space-between; gap: 1rem; align-items: flex-start; }
    .manual-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: .55rem; margin-top: .85rem; }
    .manual-pick {
      text-align: left; padding: .55rem .7rem; border-radius: 9px; border: 1.5px solid var(--border);
      background: var(--surface); color: var(--text); font-size: .82rem; cursor: pointer; display: flex;
      align-items: center; justify-content: space-between; gap: .5rem;
    }
    .manual-pick:hover { border-color: var(--primary-light); }
    .manual-pick.selected { border-color: var(--primary); background: #eef2ff; color: var(--primary-dark); font-weight: 700; }
    .manual-summary { margin-top: .8rem; display: flex; flex-wrap: wrap; gap: .45rem; align-items: center; font-size: .8rem; color: var(--text-muted); }

    /* BADGE COLOURS — one per faculty column */
    .badge-english        { background: #dbeafe; color: #1e40af; }
    .badge-humanities     { background: #fef3c7; color: #92400e; }
    .badge-science        { background: #d1fae5; color: #065f46; }
    .badge-pe             { background: #fee2e2; color: #991b1b; }
    .badge-visual-arts    { background: #ede9fe; color: #5b21b6; }
    .badge-performing-arts{ background: #fce7f3; color: #9d174d; }
    .badge-health         { background: #fdf2f8; color: #831843; }
    .badge-ict            { background: #f0fdf4; color: #166534; }
    .badge-language       { background: #fff7ed; color: #9a3412; }
    .badge-enhancement    { background: #dcfce7; color: #166534; }

    /* PER-CARD LANGUAGE SWAP BUTTONS */
    .card-lang-swap {
      display: inline-flex; align-items: center; gap: .28rem;
      padding: .22rem .55rem; border-radius: 6px; font-size: .73rem; font-weight: 600;
      cursor: pointer; border: 1.5px solid #fde68a;
      background: #fffbeb; color: #92400e; transition: all .15s; white-space: nowrap;
    }
    .card-lang-swap:hover { background: #fef3c7; }
    .card-lang-undo {
      display: inline-flex; align-items: center; gap: .28rem;
      padding: .22rem .55rem; border-radius: 6px; font-size: .73rem; font-weight: 500;
      cursor: pointer; border: 1.5px solid var(--border);
      background: transparent; color: var(--text-muted); transition: all .15s; white-space: nowrap;
    }
    .card-lang-undo:hover { border-color: var(--danger); color: var(--danger); }
    .card-required-tag { font-size: .7rem; color: var(--text-muted); font-style: italic; }
    .card-lang-limit { font-size: .7rem; color: var(--accent); font-weight: 500; }

    /* LANGUAGE SWAP ACTIONS */
    .lang-swap-row { display: flex; gap: .6rem; margin-top: .85rem; flex-wrap: wrap; align-items: center; }
    .btn-lang-swap {
      display: inline-flex; align-items: center; gap: .4rem;
      padding: .4rem 1rem; border-radius: 8px; font-size: .83rem; font-weight: 600;
      cursor: pointer; border: 1.5px solid #fde68a;
      background: #fffbeb; color: #92400e; transition: all .15s;
    }
    .btn-lang-swap:hover { background: #fef3c7; border-color: #fcd34d; }
    .btn-lang-undo {
      display: inline-flex; align-items: center; gap: .4rem;
      padding: .4rem .9rem; border-radius: 8px; font-size: .83rem; font-weight: 500;
      cursor: pointer; border: 1.5px solid var(--border);
      background: transparent; color: var(--text-muted); transition: all .15s;
    }
    .btn-lang-undo:hover { border-color: var(--danger); color: var(--danger); background: #fff1f2; }
    .lang-swapped-badge {
      font-size: .78rem; font-weight: 600; color: #92400e;
      background: #fef3c7; border: 1px solid #fde68a;
      padding: .25rem .7rem; border-radius: 99px;
    }

    /* ═══ ENHANCEMENT BANNER ═══ */
    .enhancement-banner {
      background: linear-gradient(135deg, #eef2ff, #f5f3ff);
      border: 1.5px solid #c7d2fe; border-radius: 12px;
      padding: 1rem 1.25rem; margin-top: 1.25rem;
      display: flex; gap: .75rem; align-items: flex-start;
    }
    .enhancement-banner-icon { font-size: 1.5rem; flex-shrink: 0; line-height: 1; }
    .enhancement-banner-title { font-weight: 700; font-size: .95rem; color: #4338ca; margin-bottom: .25rem; }
    .enhancement-banner-text { font-size: .85rem; color: #4338ca; line-height: 1.55; opacity: .85; }
    .enhancement-actions {
      margin-top: .9rem; padding-top: .85rem; border-top: 1px solid rgba(99,102,241,.18);
      display: grid; grid-template-columns: minmax(170px, 1fr) minmax(190px, 1fr) auto;
      gap: .65rem; align-items: end;
    }
    .enhancement-field { display: flex; flex-direction: column; gap: .3rem; }
    .enhancement-field label { font-size: .76rem; font-weight: 700; color: #4338ca; }
    .enhancement-note {
      margin-top: .7rem; font-size: .78rem; line-height: 1.5; color: #4f46e5;
      background: rgba(255,255,255,.58); border: 1px solid rgba(99,102,241,.14);
      border-radius: 9px; padding: .55rem .7rem;
    }
    .enhancement-restore-row { margin-top: .7rem; display: flex; flex-wrap: wrap; gap: .45rem; }
    .enhancement-restore-btn {
      padding: .3rem .7rem; border-radius: 999px; border: 1.5px solid #bbf7d0;
      background: #ecfdf5; color: #047857; font-size: .78rem; font-weight: 700; cursor: pointer;
    }
    .enhancement-restore-btn:hover { background: #d1fae5; border-color: #34d399; }
    .enhancement-data-note {
      margin: .8rem 0 1rem; padding: .65rem .8rem; border-radius: 10px;
      border: 1px solid #bbf7d0; background: #ecfdf5; color: #047857;
      font-size: .82rem; line-height: 1.5;
    }

    /* ═══ LANGUAGE NOTE ═══ */
    .language-note {
      background: linear-gradient(135deg, #fefce8, #fff7ed); border: 1.5px solid #fde68a;
      border-radius: 12px; padding: 1rem 1.25rem;
      display: flex; gap: .75rem; align-items: flex-start; margin-top: 1.25rem;
    }
    .language-note-icon { font-size: 1.5rem; flex-shrink: 0; line-height: 1; }
    .language-note-title { font-weight: 700; font-size: .95rem; margin-bottom: .25rem; color: #92400e; }
    .language-note-text { font-size: .85rem; color: #78350f; line-height: 1.55; }

    /* ═══ PAGE 2 TABS ═══ */
    .tabs { display: flex; gap: .25rem; margin-bottom: 1.5rem; background: var(--surface2); border-radius: 10px; padding: .3rem; }
    .tab-btn {
      flex: 1; padding: .58rem .75rem; border-radius: 8px; border: none; background: transparent;
      font-size: .86rem; font-weight: 600; cursor: pointer;
      color: var(--text-muted); transition: all .18s; white-space: nowrap;
    }
    .tab-btn.active { background: var(--surface); color: var(--primary); box-shadow: 0 2px 8px rgba(0,0,0,.08); }

    /* ═══ PROGRAM SECTION ═══ */
    .section-label { font-size: .74rem; font-weight: 700; text-transform: uppercase; letter-spacing: .07em; color: var(--text-muted); margin-bottom: .7rem; }
    .filter-chips { display: flex; flex-wrap: wrap; gap: .4rem; margin-bottom: 1.25rem; }
    .filter-chip {
      padding: .28rem .75rem; border-radius: 99px; border: 1.5px solid var(--border);
      font-size: .78rem; font-weight: 500; cursor: pointer; background: var(--surface); color: var(--text-muted); transition: all .15s;
    }
    .filter-chip:hover { border-color: var(--primary-light); color: var(--primary); }
    .filter-chip.active { background: var(--primary); border-color: var(--primary); color: #fff; }
    .program-toolbar { display: flex; flex-wrap: wrap; justify-content: space-between; gap: .75rem; align-items: center; margin-bottom: .9rem; }
    .program-summary { font-size: .8rem; font-weight: 700; color: var(--text-muted); }
    .program-year-toggle {
      border: 1.5px solid var(--border); background: var(--surface); color: var(--text-muted);
      border-radius: 9px; padding: .45rem .85rem; font-size: .8rem; font-weight: 700;
      display: inline-flex; align-items: center; gap: .4rem; cursor: pointer; transition: all .15s;
    }
    .program-year-toggle:hover { border-color: var(--primary-light); color: var(--primary); }
    .program-year-toggle.active { background: #eef2ff; color: var(--primary); border-color: var(--primary-light); }
    .program-pinned-strip {
      background: linear-gradient(135deg, #f8fafc, #eef2ff);
      border: 1px solid var(--border); border-radius: 12px; padding: .95rem 1rem;
      margin-bottom: 1rem; box-shadow: var(--shadow);
    }
    .program-pinned-title {
      font-size: .72rem; font-weight: 800; text-transform: uppercase; letter-spacing: .07em;
      color: var(--text-muted); margin-bottom: .55rem;
    }
    .program-pinned-chips { display: flex; flex-wrap: wrap; gap: .4rem; }
    .program-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 1rem; }
    .program-card {
      background: var(--surface); border: 1.5px solid var(--border); border-radius: 12px;
      box-shadow: var(--shadow); padding: 1rem; display: flex; flex-direction: column;
      gap: .65rem; min-height: 245px; transition: transform .15s, box-shadow .15s, border-color .15s, opacity .15s;
    }
    .program-card:hover { transform: translateY(-2px); box-shadow: var(--shadow-lg); }
    .program-card.ended { background: #f8fafc; opacity: .66; filter: grayscale(.45); }
    .program-card.attending {
      background: linear-gradient(135deg, #fffbeb, #fef3c7);
      border-color: #f59e0b; box-shadow: 0 10px 34px rgba(245,158,11,.24);
      opacity: 1; filter: none;
    }
    .program-card-top { display: flex; justify-content: space-between; gap: .65rem; align-items: flex-start; }
    .program-subject-tag {
      display: inline-flex; align-items: center; gap: .25rem; padding: .22rem .58rem;
      border-radius: 999px; background: #eef2ff; color: var(--primary);
      font-size: .7rem; font-weight: 800; line-height: 1.2;
    }
    .program-status {
      flex-shrink: 0; padding: .2rem .55rem; border-radius: 999px;
      font-size: .68rem; font-weight: 800; line-height: 1.2;
    }
    .program-status.open { background: #dcfce7; color: #166534; }
    .program-status.ended { background: #e2e8f0; color: #475569; }
    .program-status.attending { background: #f59e0b; color: #fff; }
    .program-title { font-size: .98rem; font-weight: 850; line-height: 1.25; color: var(--text); }
    .program-meta { display: flex; flex-wrap: wrap; gap: .4rem; font-size: .75rem; color: var(--text-muted); }
    .program-meta span {
      background: var(--surface2); border: 1px solid var(--border); border-radius: 7px;
      padding: .22rem .45rem;
    }
    .program-card.attending .program-meta span { background: rgba(255,255,255,.58); border-color: #fde68a; }
    .program-desc { font-size: .82rem; color: var(--text-muted); line-height: 1.5; }
    .program-actions { margin-top: auto; display: flex; align-items: center; justify-content: space-between; gap: .7rem; flex-wrap: wrap; }
    .program-attend-btn {
      border: 1.5px solid var(--border); background: var(--surface); color: var(--text-muted);
      border-radius: 8px; padding: .42rem .7rem; font-size: .78rem; font-weight: 800;
      cursor: pointer; display: inline-flex; align-items: center; gap: .35rem; transition: all .15s;
    }
    .program-attend-btn:hover { border-color: #f59e0b; color: #92400e; background: #fffbeb; }
    .program-attend-btn.active { border-color: #f59e0b; background: #f59e0b; color: #fff; }
    .program-link {
      color: var(--primary); font-size: .78rem; font-weight: 800;
      display: inline-flex; align-items: center; gap: .3rem; text-decoration: none;
    }
    .program-link:hover { text-decoration: underline; }
    .empty-programs {
      text-align: center; padding: 3rem 1.5rem; background: var(--surface);
      border: 1px dashed var(--border); border-radius: var(--radius);
    }
    .empty-programs-emoji { font-size: 2.5rem; margin-bottom: .75rem; }
    .empty-programs-text { font-size: .95rem; font-weight: 600; color: var(--text-muted); }
    .empty-programs-sub { font-size: .83rem; color: var(--text-muted); margin-top: .3rem; }
    @media (max-width: 780px) {
      .program-grid { grid-template-columns: 1fr; }
      .program-card { min-height: unset; }
    }

    /* ═══ CAREER MAP ═══ */
    .career-map {
      background: linear-gradient(135deg, #f0f4ff 0%, #faf5ff 100%);
      border: 1px solid var(--border); border-radius: var(--radius); padding: 1.75rem; overflow-x: auto;
    }
    .map-header-row { display: grid; grid-template-columns: 200px 32px 1fr 32px 1fr; gap: .5rem; margin-bottom: .75rem; padding-bottom: .5rem; border-bottom: 1px solid var(--border); }
    .map-col-title { font-size: .72rem; font-weight: 800; text-transform: uppercase; letter-spacing: .07em; color: var(--text-muted); }
    .map-row { display: grid; grid-template-columns: 200px 32px 1fr 32px 1fr; gap: .5rem; align-items: center; margin-bottom: .6rem; }
    .map-node { background: var(--surface); border-radius: 9px; border: 1.5px solid var(--border); padding: .5rem .8rem; font-size: .82rem; font-weight: 600; box-shadow: 0 1px 4px rgba(0,0,0,.05); }
    .map-node.elective-node { border-left-width: 4px; }
    .map-node.career-node { color: var(--text-muted); font-weight: 500; }
    .map-node.uni-node { border-left: 4px solid var(--accent); font-size: .8rem; }
    .map-arrow-cell { display: flex; align-items: center; justify-content: center; color: var(--primary-light); font-size: 1.1rem; font-weight: 700; }
    .map-multi { display: flex; flex-direction: column; gap: .35rem; }

    /* ═══ LOCKED OVERLAY ═══ */
    .locked-overlay {
      display: flex; flex-direction: column; align-items: center;
      justify-content: center; text-align: center; padding: 3rem 2rem; gap: 1rem;
    }
    .locked-icon { font-size: 2.8rem; }
    .locked-title { font-size: 1.05rem; font-weight: 700; color: var(--text-muted); }
    .locked-sub { font-size: .86rem; color: var(--text-muted); max-width: 320px; line-height: 1.5; }

    /* ═══ PROGRESS CHECKLIST ═══ */
    .progress-subject { margin-bottom: 1.25rem; }
    .progress-subject-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: .6rem; }
    .progress-subject-name { font-size: .97rem; font-weight: 700; }
    .progress-pct { font-size: .83rem; font-weight: 700; color: var(--primary); }
    .progress-bar-track { height: 7px; background: var(--border); border-radius: 99px; overflow: hidden; margin-bottom: .7rem; }
    .progress-bar-fill { height: 100%; border-radius: 99px; background: linear-gradient(90deg, var(--primary), var(--primary-light)); transition: width .5s ease; }
    .checklist-items { display: flex; flex-direction: column; gap: .4rem; }
    .checklist-item {
      display: flex; align-items: center; gap: .6rem; padding: .48rem .75rem; border-radius: 8px;
      background: var(--surface2); cursor: pointer; transition: background .15s; user-select: none;
    }
    .checklist-item:hover { background: var(--border); }
    .checklist-item.done { opacity: .6; }
    .checklist-item.done .checklist-label { text-decoration: line-through; }
    .checklist-checkbox { width: 17px; height: 17px; border-radius: 5px; border: 2px solid var(--border); flex-shrink: 0; display: grid; place-items: center; transition: all .15s; }
    .checklist-checkbox.checked { border-color: var(--success); background: var(--success); }
    .checklist-label { font-size: .85rem; }

    /* ═══ SKILLS ═══ */
    .skills-grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: .75rem; margin-top: 1rem; }
    .skill-item { display: flex; flex-direction: column; align-items: center; gap: .45rem; }
    .skill-label { font-size: .78rem; font-weight: 700; color: var(--text); text-align: center; }
    .skill-stars { display: flex; gap: .18rem; }
    .skill-star { width: 26px; height: 26px; cursor: pointer; color: var(--border); transition: color .12s; background: none; border: none; padding: 0; font-size: 1.3rem; line-height: 1; }
    .skill-star.filled { color: var(--accent); }
    .skill-star:hover { color: #fbbf24; }

    /* ═══ STEM TOGGLE ═══ */
    .stem-toggle-row { display: flex; align-items: center; gap: .75rem; margin-top: 1rem; flex-wrap: wrap; }
    .stem-btn { padding: .5rem 1.4rem; border-radius: 8px; border: 2px solid var(--border); background: var(--surface); font-size: .95rem; font-weight: 700; cursor: pointer; transition: all .15s; }
    .stem-btn.yes.active { border-color: var(--primary); background: var(--primary); color: #fff; }
    .stem-btn.no.active  { border-color: var(--border); background: var(--surface2); color: var(--text-muted); }

    /* ═══ Y9 ELECTIVES ═══ */
    .y9-row { display: grid; grid-template-columns: 1fr 150px 34px; gap: .5rem; margin-bottom: .5rem; align-items: center; }

    /* ═══ Y9-SOURCE NOTE ON CARD ═══ */
    .y9-source-note { font-size: .76rem; color: #92400e; background: #fef3c7; border: 1px solid #fde68a; border-radius: 7px; padding: .35rem .65rem; margin-top: .5rem; line-height: 1.45; }

    /* ═══ SETTINGS ═══ */
    .settings-overlay { position: fixed; inset: 0; background: rgba(0,0,0,.35); z-index: 900; }
    .settings-panel {
      position: fixed; top: 0; right: 0; bottom: 0; width: 360px; max-width: 100vw;
      background: var(--surface); box-shadow: -8px 0 40px rgba(0,0,0,.15); z-index: 901;
      display: flex; flex-direction: column; overflow-y: auto;
      animation: slideInRight .22s ease;
    }
    @keyframes slideInRight { from { transform: translateX(100%); } to { transform: translateX(0); } }
    .settings-header { padding: 1.4rem 1.5rem 1rem; border-bottom: 1px solid var(--border); display: flex; align-items: center; justify-content: space-between; }
    .settings-title { font-size: 1.1rem; font-weight: 800; }
    .settings-close { width: 32px; height: 32px; border-radius: 8px; border: 1.5px solid var(--border); background: transparent; cursor: pointer; display: grid; place-items: center; color: var(--text-muted); transition: all .15s; }
    .settings-close:hover { border-color: var(--danger); color: var(--danger); }
    .settings-body { flex: 1; padding: 1.5rem; display: flex; flex-direction: column; gap: 1.25rem; }
    .settings-section-label { font-size: .72rem; font-weight: 800; text-transform: uppercase; letter-spacing: .08em; color: var(--text-muted); margin-bottom: .6rem; }
    .avatar-wrap { display: flex; flex-direction: column; align-items: center; gap: .75rem; }
    .avatar-circle { width: 80px; height: 80px; border-radius: 50%; background: var(--primary); color: #fff; display: grid; place-items: center; font-size: 1.6rem; font-weight: 800; overflow: hidden; cursor: pointer; border: 3px solid var(--border); transition: border-color .15s; position: relative; }
    .avatar-circle:hover { border-color: var(--primary); }
    .avatar-circle img { width: 100%; height: 100%; object-fit: cover; }
    .avatar-hint { font-size: .78rem; color: var(--text-muted); }
    .settings-credits { margin-top: auto; padding-top: 1.25rem; border-top: 1px solid var(--border); font-size: .75rem; color: var(--text-muted); line-height: 1.65; }
    .nav-settings-btn { width: 32px; height: 32px; border-radius: 8px; border: 1.5px solid var(--border); background: transparent; cursor: pointer; display: grid; place-items: center; color: var(--text-muted); transition: all .15s; }
    .nav-settings-btn:hover { border-color: var(--primary); color: var(--primary); background: rgba(99,102,241,.06); }

    /* ═══ GUEST BANNER ═══ */
    .guest-banner { background: #fffbeb; border-bottom: 1.5px solid #fde68a; padding: .5rem 2rem; font-size: .82rem; color: #92400e; display: flex; align-items: center; gap: .5rem; }

    /* ═══ EXPLORE DROPDOWN NAV ═══ */
    .nav-dropdown-wrap { position: relative; }
    .nav-dropdown-menu {
      position: absolute; top: calc(100% + 8px); left: 0; min-width: 210px;
      background: var(--surface); border: 1px solid var(--border); border-radius: 12px;
      box-shadow: 0 8px 32px rgba(0,0,0,.12); z-index: 200; overflow: hidden;
      animation: fadeIn .15s ease;
    }
    .nav-dropdown-item {
      width: 100%; padding: .65rem 1rem; border: none; background: transparent;
      font-size: .88rem; font-weight: 500; color: var(--text); cursor: pointer;
      text-align: left; display: flex; align-items: center; gap: .6rem; transition: background .12s;
    }
    .nav-dropdown-item:hover { background: var(--surface2); }
    .nav-dropdown-item.active { color: var(--primary); font-weight: 700; }

    /* ═══ PROGRESS CHECKLIST REDESIGN ═══ */
    .checklist-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 1.1rem; }
    .checklist-elective-card { border-radius: var(--radius); overflow: hidden; box-shadow: var(--shadow); border: 1px solid var(--border); }
    .checklist-elective-header { padding: .8rem 1.1rem; display: flex; align-items: center; justify-content: space-between; }
    .checklist-elective-name { font-size: .95rem; font-weight: 700; color: #fff; }
    .checklist-elective-pct { font-size: .8rem; font-weight: 700; color: rgba(255,255,255,.85); }
    .checklist-elective-bar { height: 4px; background: rgba(255,255,255,.3); }
    .checklist-elective-bar-fill { height: 100%; background: #fff; transition: width .4s ease; }
    .checklist-elective-body { padding: .85rem 1rem; background: var(--surface); }
    .checklist-semester { font-size: .7rem; font-weight: 800; text-transform: uppercase; letter-spacing: .07em; color: var(--text-muted); margin: .55rem 0 .4rem; }
    .checklist-item-v2 { display: flex; align-items: center; gap: .55rem; padding: .42rem .6rem; border-radius: 8px; cursor: pointer; transition: background .12s; user-select: none; }
    .checklist-item-v2:hover { background: var(--surface2); }
    .checklist-item-v2.done .checklist-label { text-decoration: line-through; opacity: .55; }
    .checklist-item-v2.highlight { background: #fffbeb; border: 1px solid #fde68a; font-weight: 800; }
    .checklist-item-v2.highlight:hover { background: #fef3c7; }
    .checklist-item-v2.highlight .checklist-label { color: #92400e; }
    .checklist-cb { width: 18px; height: 18px; border-radius: 5px; border: 2px solid var(--border); flex-shrink: 0; display: grid; place-items: center; transition: all .15s; }
    .checklist-cb.checked { border-color: var(--success); background: var(--success); }
    .checklist-missing-note { font-size: .78rem; line-height: 1.45; color: #92400e; background: #fffbeb; border: 1px solid #fde68a; border-radius: 8px; padding: .55rem .65rem; margin: .55rem 0 .75rem; }
    .checklist-complete-badge { display: inline-flex; align-items: center; gap: .35rem; font-size: .76rem; font-weight: 700; color: var(--success); margin-top: .5rem; }
    @media (max-width: 780px) { .checklist-grid { grid-template-columns: 1fr; } }

    /* ═══ MINDMAP / PAGE 3 ═══ */
    .mindmap-page { flex: 1; padding: 2.5rem 2rem; max-width: 1180px; margin: 0 auto; width: 100%; }
    .enhancement-select-grid { display: grid; grid-template-columns: 1fr 1fr; gap: .75rem; margin-top: .75rem; }
    .mindmap-canvas {
      position: relative; min-height: 760px; border-radius: 18px; border: 1px solid var(--border);
      background:
        radial-gradient(circle at center, rgba(99,102,241,.12) 0 80px, transparent 82px),
        linear-gradient(135deg, #f8fafc, #eef2ff);
      overflow: hidden; box-shadow: var(--shadow); margin-top: 1.4rem;
    }
    .mindmap-center-label {
      position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%);
      width: 150px; height: 150px; text-align: center; background: linear-gradient(135deg, var(--primary), var(--primary-dark));
      color: #fff; border-radius: 50%; display: grid; place-items: center; padding: 1rem;
      font-size: 1.1rem; font-weight: 900; letter-spacing: -.02em; box-shadow: 0 10px 30px rgba(99,102,241,.35); z-index: 4;
    }
    .mindmap-branch {
      position: absolute; left: 50%; top: 50%; height: 2px; background: rgba(99,102,241,.22);
      transform-origin: 0 50%; z-index: 1;
    }
    .mindmap-cat-node {
      position: absolute; width: 150px; min-height: 78px; transform: translate(-50%, -50%);
      border: 2px solid transparent; border-radius: 16px; background: var(--surface); box-shadow: var(--shadow);
      cursor: pointer; display: flex; flex-direction: column; align-items: center; justify-content: center;

const accountCacheKey = (userId) => `elect_account_cache_${userId}`;
const readAccountCache = (userId) => {
  try { return JSON.parse(localStorage.getItem(accountCacheKey(userId)) || 'null'); }
  catch { return null; }
};
const writeAccountCache = (userId, payload) => {
  try { localStorage.setItem(accountCacheKey(userId), JSON.stringify(payload)); }
  catch {}
};

async function dbLoadUser(userId) {
  const cached = readAccountCache(userId);
  let res = null;
  let chk = null;
  try {
    const results = await Promise.all([
      db.from('elective_results').select('*').eq('user_id', userId).maybeSingle(),
      db.from('checklist_progress').select('*').eq('user_id', userId).maybeSingle(),
    ]);
    if (results[0].error) throw results[0].error;
    if (results[1].error) throw results[1].error;
    res = results[0].data;
    chk = results[1].data;
  } catch (err) {
    console.warn('Supabase load failed, using local account cache if available.', err);
  }
  // Re-map saved suggestions/pool against the live ALL_ELECTIVES definitions so that
  // faculty reclassifications, new descriptions, and badge updates are always shown —
  // even when the DB row was saved before those code changes were deployed.
  // Language continuation cards (id starts with "lang_") are kept as-is.
  const remap = (arr) => {
    if (!Array.isArray(arr)) return arr || [];
    return arr.map(s => {
      if (!s?.id || s.id.startsWith('lang_')) return s;
      const live = ALL_ELECTIVES.find(e => e.id === s.id);
      return live ? { ...live } : s;
    });
  };

  const loaded = {
    submittedData: res ? {
      studentData: res.student_data,
      suggestions: remap(res.suggestions),
      pool:        remap(res.pool),
      isLocked:    res.is_locked,
    } : (cached?.submittedData ? {
      ...cached.submittedData,
      suggestions: remap(cached.submittedData.suggestions),
      pool: remap(cached.submittedData.pool),
    } : null),
    checklistState: chk?.checklist_state || cached?.checklistState || {},
  };
  if (res || chk) writeAccountCache(userId, loaded);
  return loaded;
}

async function dbSaveElectiveResults(userId, { studentData, suggestions, pool, isLocked }) {
  const cached = readAccountCache(userId) || {};
  writeAccountCache(userId, {
    ...cached,
    submittedData: { studentData, suggestions, pool, isLocked },
    checklistState: cached.checklistState || {},
  });
  const { error } = await db.from('elective_results').upsert({
    user_id: userId,
    student_data: studentData,
    suggestions,
    pool,
    is_locked: isLocked,
    updated_at: new Date().toISOString(),
  }, { onConflict: 'user_id' });
  if (error) throw error;
}

async function dbSaveChecklist(userId, checklistState) {
  const cached = readAccountCache(userId) || {};
  writeAccountCache(userId, { ...cached, checklistState });
  const { error } = await db.from('checklist_progress').upsert({
    user_id: userId,
    checklist_state: checklistState,
    updated_at: new Date().toISOString(),
  }, { onConflict: 'user_id' });
  if (error) throw error;
}

async function dbClearResults(userId) {
  await Promise.all([
    db.from('elective_results').delete().eq('user_id', userId),
    db.from('checklist_progress').delete().eq('user_id', userId),
  ]);
}

async function dbLoadProfile(userId) {

const getLanguagePathway = (language) => CAREER_UNI_PATHWAYS[String(language || '').toLowerCase()] || {
  universities: [],
  careers: [],
};

function getCareerUniPathway(elective) {
  if (!elective) return { universities: [], careers: [] };
  if (isEnhancementElective(elective)) return { universities: [], careers: [] };
  const direct = CAREER_UNI_PATHWAYS[elective.id];
  if (direct) return direct;
  const language = ['French', 'German', 'Spanish'].find(lang =>
    elective.name === lang || elective.name?.startsWith(`${lang} `) || elective.name?.startsWith(`${lang} —`)
  );
  if (language) return getLanguagePathway(language);
  return {
    universities: elective.universities || [],
    careers: elective.careers || [],
  };
}

function isEnhancementElective(elective) {
  return elective?.category === 'enhancement' || elective?.id?.startsWith('enh_');
}

function makeEnhancementElective(enhancementName, original) {
  return {
    id: `enh_${enhancementName.replace(/\W+/g,'_').toLowerCase()}`,
    name: `${enhancementName} (Enhancement)`,
    category: 'enhancement',
    badge: 'badge-enhancement',
    description: `Year 11 VCE ${enhancementName} studied in Year 10 as an acceleration/enhancement subject.`,
    careers: [],
    universities: [],
    _enhOriginalId: original?.id,
  };
}

function getYear11EnhancementOptions(showMaths, showScience) {
  const options = [];
  const addCat = (catId) => {
    const cat = YEAR11_CATS.find(c => c.id === catId);
    if (cat) options.push(...cat.subjects.map(s => s.name));
  };
  if (showMaths) addCat('mathematics');
  if (showScience) addCat('science');
  return [...new Set(options)];
}

ALL_ELECTIVES.forEach(elective => {
  const pathway = CAREER_UNI_PATHWAYS[elective.id];
  if (pathway) {
    elective.universities = pathway.universities;
    elective.careers = pathway.careers;
  }
});

function getChecklistSourceKey(elective) {
  if (!elective) return '';
  if (ELECTIVE_CHECKLIST_DATA[elective.id]) return elective.id;
  const language = ['French', 'German', 'Spanish'].find(lang =>
    elective.name === lang || elective.name?.startsWith(`${lang} `) || elective.name?.startsWith(`${lang} —`)
  );
  return language ? language.toLowerCase() : elective.id;
}

function makeChecklistItem(label, key, highlight = false) {
  return { label, key, highlight };
}

function getElectiveChecklist(elective) {
  const sourceKey = getChecklistSourceKey(elective);
  const items = ELECTIVE_CHECKLIST_DATA[sourceKey] || [];
  const midpoint = Math.ceil(items.length / 2);
  return {
    missing: items.length === 0,
    semester1: [
      ...items.slice(0, midpoint).map((label, i) => makeChecklistItem(label, `s1-${i}`)),
      makeChecklistItem('Revise Semester 1', 'revise-semester-1', true),
    ],
    semester2: [
      ...items.slice(midpoint).map((label, i) => makeChecklistItem(label, `s2-${i}`)),
      makeChecklistItem('Revise Semester 2', 'revise-semester-2', true),
    ],
  };
}

  mechanical:['ict','science'],
  logical:   ['law_economics','maths','science'],
  visual:    ['visual_arts','performing_arts'],
};

/* ═══════════════════════════════════════════════════════════════
   ALGORITHM — 7-STEP CATEGORY POINTSBOARD
   Returns pts object: { engineering, maths, science, english,
     visual_arts, performing_arts, ict, pe, law_economics, humanities }
═══════════════════════════════════════════════════════════════ */
function runAlgorithm(studentData) {
  const { grades = {}, desiredElectives = [], careerCategory, universities = [],
          skills = {}, year9Electives = [], stemPreference = false } = studentData;

  const pts = { engineering:0, maths:0, science:0, english:0, visual_arts:0,
                performing_arts:0, ict:0, pe:0, law_economics:0, humanities:0 };

  // Step 1: University points (1st=+1.5, 2nd=+1.0, 3rd=+0.5 per uni, up to 2 unis)
  for (const uni of universities) {
    const cats = UNI_SUBJECT_MAP[uni];
    if (!cats) continue;
    [1.5, 1.0, 0.5].forEach((w, i) => { if (cats[i] in pts) pts[cats[i]] += w; });
  }

  // Step 2: Career category → +2 pts each to assigned subjects
  for (const cat of (CAREER_SUBJECT_MAP[careerCategory] || [])) {
    if (cat in pts) pts[cat] += 2;
  }

  // Step 3: Core grades — 90+ → +1.5, 80+ → +1.0
  const coreMap = { Mathematics:'maths', Science:'science', English:'english', Humanities:'humanities' };
  for (const [subj, cat] of Object.entries(coreMap)) {
    const g = Number(grades[subj] || 0);
    if (g >= 90) pts[cat] += 1.5;
    else if (g >= 80) pts[cat] += 1.0;
  }

  // Step 4: Desired electives → +1 each to their category
  for (const id of desiredElectives) {
    const cat = ELECTIVE_CAT_MAP[id];
    if (cat && cat in pts) pts[cat] += 1;
  }

  // Step 5: Genuine skills — top-rated skill(s) add +1.0 to each assigned category
  const skillVals = Object.entries(skills).filter(([,v]) => v > 0);
  if (skillVals.length > 0) {
    const maxVal = Math.max(...skillVals.map(([,v]) => v));
    for (const [skill, val] of skillVals) {
      if (val === maxVal) {
        for (const cat of (SKILL_CAT_MAP_ALGO[skill] || [])) {
          if (cat in pts) pts[cat] += 1.0;
        }
      }
    }
  }

  // Step 6: Y9 elective grade 90+ → +1 to that elective's category
  for (const { id: y9Id, grade } of year9Electives) {
    if (Number(grade) >= 90) {
      const y10Id = Y9_TO_Y10[y9Id];
      const cat = ELECTIVE_CAT_MAP[y10Id];
      if (cat && cat in pts) pts[cat] += 1;
    }
  }

  // Step 7: STEM O → +1 each to maths/science/ict/law_economics/humanities
  //          STEM X → +1 each to english/visual_arts/performing_arts/pe
  if (stemPreference) {
    ['maths','science','ict','law_economics','humanities'].forEach(c => pts[c] += 1);
  } else {
    ['english','visual_arts','performing_arts','pe'].forEach(c => pts[c] += 1);
  }

  return pts;
}

function buildYear10Selection(pts, studentData = {}) {
  const { grades = {}, careerCategory = '', desiredElectives = [], universities = [], year9Electives = [] } = studentData;
  const selected = [];
  const usedIds = new Set();
  const actualCatCount = {};
  const algoCatCount = {};
  const peUniversity = universities.some(u => (UNI_SUBJECT_MAP[u] || []).includes('pe'));
  const peCraving = desiredElectives.some(id => PE_IDS.includes(id) || id === 'outdoor_ed') || peUniversity;
  const peCap = peCraving ? 2 : 1;
  const isActualMinor = (e) => ['visual_arts','performing_arts','health','ict'].includes(e.category);
  const desiredMinor = desiredElectives.some(id => {
    const e = ALL_ELECTIVES.find(x => x.id === id);
    return e && isActualMinor(e);
  });
  const y9Minor = year9Electives.some(r => {
    const e = ALL_ELECTIVES.find(x => x.id === Y9_TO_Y10[r.id]);
    return e && isActualMinor(e);
  });
  const careerMinor = ['Visual Arts','Performing Arts','Technology & Engineering','Design & Media'].includes(careerCategory);
  const uniMinor = universities.some(u => (UNI_SUBJECT_MAP[u] || []).some(c => ['visual_arts','performing_arts','ict'].includes(c)));
  const minorCraving = desiredMinor || y9Minor || careerMinor || uniMinor;
  const minorCap = minorCraving ? 4 : 2;
  const sciGradeHigh = Number(grades['Science'] || 0) >= 90;
  const categoryCap = (e) => {
    const algoCat = ELECTIVE_CAT_MAP[e.id] || 'humanities';
    if (PE_IDS.includes(e.id)) return peCap;
    if (algoCat === 'science') return sciGradeHigh ? 3 : 2;
    if (isActualMinor(e)) return minorCap;
    return Infinity;
  };

  const addE = (id, force = false) => {
    const e = ALL_ELECTIVES.find(x => x.id === id);
    if (!e || usedIds.has(id)) return false;
    const algoCat = ELECTIVE_CAT_MAP[id] || 'humanities';
    if (!force) {
      if ((algoCatCount[algoCat] || 0) >= categoryCap(e)) return false;
      if (PE_IDS.includes(id) && (actualCatCount.pe || 0) >= peCap) return false;
      if (isActualMinor(e)) {
        const currentMinor = selected.filter(isActualMinor).length;
        if (currentMinor >= minorCap) return false;
      }
    }
    selected.push(e); usedIds.add(id);
    actualCatCount[e.category] = (actualCatCount[e.category] || 0) + 1;
    algoCatCount[algoCat] = (algoCatCount[algoCat] || 0) + 1;
    return true;
  };

  // ── 1. History vs Geography ───────────────────────────────────
  // Geography-leaning: high science/engineering/ict/pe side
  // History-leaning: high humanities/english/law_economics/performing_arts side
  const geoScore = pts.science + pts.engineering + pts.ict + pts.pe;
  const histScore = pts.humanities + pts.english + pts.law_economics + pts.performing_arts;
  const desiredHist = desiredElectives.includes('history');
  const desiredGeo  = desiredElectives.includes('geography');
  const uniCats = universities.flatMap(u => UNI_SUBJECT_MAP[u] || []);
  const uniGeoLean = uniCats.filter(c => ['science','engineering','ict','pe'].includes(c)).length;
  const uniHistLean = uniCats.filter(c => ['humanities','english','law_economics','performing_arts'].includes(c)).length;
  const y9GeoLean = year9Electives.some(r => ['sustainability','cities_of_the_future','mission_to_mars','sports_science','robotics'].includes(r.id));
  const y9HistLean = year9Electives.some(r => ['hands_on_history','indigenous_studies','journalism','literature','english_skills'].includes(r.id));
  let histGeoChoice;
  if (desiredHist && !desiredGeo)       histGeoChoice = 'history';
  else if (desiredGeo && !desiredHist)  histGeoChoice = 'geography';
  else if (careerCategory === 'Environment & Agriculture' || y9GeoLean || geoScore + uniGeoLean > histScore + uniHistLean)
                                        histGeoChoice = 'geography';
  else if (y9HistLean || histScore + uniHistLean > geoScore + uniGeoLean)
                                        histGeoChoice = 'history';
  else if (studentData.stemPreference)  histGeoChoice = 'geography';
  else                                  histGeoChoice = 'history';
  addE(histGeoChoice, true);

  // ── 2. PE for Life vs Human Movement ─────────────────────────
  // Human Movement only for medicine/healthcare career or PE teaching context
  // (NOT chosen simply because of high grades or STEM)
  const desiredHM  = desiredElectives.includes('human_movement');
  const desiredPFL = desiredElectives.includes('pe_for_life');
  let peChoice;
  if (desiredHM && !desiredPFL)                   peChoice = 'human_movement';
  else if (desiredPFL && !desiredHM)              peChoice = 'pe_for_life';
  else if (careerCategory === 'Medicine & Healthcare') peChoice = 'human_movement';
  else if (careerCategory === 'Education & Social Work' && pts.science >= 2)
                                                  peChoice = 'human_movement';
  else                                            peChoice = 'pe_for_life';
  addE(peChoice, true);

  // ── 3. Science elective choice ───────────────────────────────
  const desiredSci = desiredElectives.find(id => SCIENCE_IDS.includes(id));
  let sciChoice;
  if (desiredSci) {
    sciChoice = desiredSci;
  } else if (careerCategory === 'Medicine & Healthcare') {
    sciChoice = 'biology';
  } else if (careerCategory === 'Environment & Agriculture') {
    sciChoice = 'environmental_science';
  } else if (pts.engineering >= pts.maths && pts.engineering > pts.humanities) {
    sciChoice = 'physics';
  } else if (pts.maths > pts.science && pts.maths > 0) {
    sciChoice = 'chemistry';
  } else {
    sciChoice = 'biology';
  }
  addE(sciChoice, true);

  // ── 4–8. Remaining 5 from category pointsboard (maths excluded) ──
  // Build available electives per category (excluding already used)
  const availByCat = {};
  for (const e of ALL_ELECTIVES) {
    if (usedIds.has(e.id)) continue;
    const cat = ELECTIVE_CAT_MAP[e.id] || 'humanities';
    if (!availByCat[cat]) availByCat[cat] = [];
    availByCat[cat].push(e.id);
  }

  // Sort categories by pts descending, exclude maths
  const workPts = { ...pts };
  delete workPts.maths;
  const sortedCats = Object.entries(workPts).sort((a, b) => b[1] - a[1]).map(([k]) => k);

  // Prioritise desired non-mandatory electives within each category
  for (const cat of Object.keys(availByCat)) {
    availByCat[cat].sort((a, b) => {
      const aD = desiredElectives.includes(a) ? -1 : 1;
      const bD = desiredElectives.includes(b) ? -1 : 1;
      return aD - bD;
    });
  }

  let remaining = 5;
  let firstViableCatUsed = false;
  for (const cat of sortedCats) {
    if (remaining <= 0) break;
    const avail = (availByCat[cat] || []).filter(id => !usedIds.has(id));
    if (avail.length === 0) continue;
    const maxFromCat = !firstViableCatUsed ? (cat === 'science' && sciGradeHigh ? 3 : 2) : 1;
    let addedFromCat = 0;
    for (const id of avail) {
      if (remaining <= 0 || addedFromCat >= maxFromCat) break;
      if (addE(id)) { remaining--; addedFromCat++; }
    }
    if (addedFromCat > 0) firstViableCatUsed = true;
  }

  // Fill any remaining slots while still respecting PE/minor/category caps
  for (const e of ALL_ELECTIVES) {
    if (selected.length >= 8) break;
    addE(e.id);
  }

  return selected.slice(0, 8);
}

function Icon({ name, size = 16 }) {
  return (
    <svg width={size} height={size} style={{ display:'inline-block', verticalAlign:'middle', flexShrink: 0 }}
         dangerouslySetInnerHTML={{ __html: feather.icons[name]?.toSvg({ width: size, height: size }) || '' }} />
  );
}

function RequirementBar({ label, filled, total, color }) {
  const pct = Math.min(100, (filled / total) * 100);
  return (
    <div className="req-bar">
      <div className="req-bar-label">{label}</div>
      <div className="req-bar-track"><div className="req-bar-fill" style={{ width:`${pct}%`, background: color }} /></div>
      <div className="req-bar-count" style={{ color }}>{filled}/{total}</div>
    </div>
  );
}

/* ═══════════════════════════════════════════════════════════════
   AUTH SCREEN
═══════════════════════════════════════════════════════════════ */
function AuthScreen({ onGuest, recoveryMode = false, onRecoveryDone }) {
  const [tab, setTab] = useState('login');
  const [email, setEmail] = useState('');
  const [password, setPassword] = useState('');
  const [loading, setLoading] = useState(false);
  const [error, setError] = useState('');
  const [success, setSuccess] = useState('');
  // forgot password flow: 'idle' | 'enter_email' | 'enter_code' | 'new_password'
  const [fpStep, setFpStep] = useState(recoveryMode ? 'new_password' : 'idle');
  const [fpEmail, setFpEmail] = useState('');
  const [fpCode, setFpCode] = useState('');
  const [fpNewPw, setFpNewPw] = useState('');
  const [fpLoading, setFpLoading] = useState(false);

  const clear = () => { setError(''); setSuccess(''); };

  useEffect(() => {
    if (recoveryMode) {
      setFpStep('new_password');
      setSuccess('Password reset verified. Set your new password below.');
      setError('');
    }
  }, [recoveryMode]);

  const handleLogin = async (e) => {
    e.preventDefault(); clear(); setLoading(true);
    const { error } = await db.auth.signInWithPassword({ email, password });
    if (error) setError(error.message);
    setLoading(false);
  };

  const handleSignUp = async (e) => {
    e.preventDefault(); clear(); setLoading(true);
    const { error } = await db.auth.signUp({ email, password });
    if (error) setError(error.message);
    else setSuccess('Account created! Check your email to confirm, then log in.');
    setLoading(false);
  };

  const handleFpSendCode = async () => {
    if (!fpEmail) return;
    setFpLoading(true); setError('');
    const { error } = await db.auth.signInWithOtp({
      email: fpEmail,
      options: {
        shouldCreateUser: false,
        emailRedirectTo: window.location.origin,
      },
    });
    if (error) setError(error.message);
    else { setFpStep('enter_code'); setFpCode(''); setSuccess('Check your email. If the email shows a code, enter it below; if it shows a login link, open it and then set your new password here.'); }
    setFpLoading(false);
  };

  const handleVerifyOtp = async () => {
    if (!fpCode) return;
    setFpLoading(true); setError('');
    const { error } = await db.auth.verifyOtp({ email: fpEmail, token: fpCode, type: 'email' });
    if (error) setError(error.message);
    else { setFpStep('new_password'); setSuccess('Verified! Set your new password below.'); }
    setFpLoading(false);
  };

  const handleFpSetPassword = async () => {
    if (!fpNewPw || fpNewPw.length < 6) { setError('Password must be at least 6 characters.'); return; }
    setFpLoading(true); setError('');
    const { error } = await db.auth.updateUser({ password: fpNewPw });
    if (error) setError(error.message);
    else {
      setSuccess('Password updated! You are now logged in.');
      setFpStep('idle');
      onRecoveryDone?.();
    }
    setFpLoading(false);
  };

  return (
    <div className="auth-bg">
      <div className="auth-card">
        <div className="auth-logo">
          <span className="auth-logo-icon">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="white" strokeWidth="2.5">
              <path d="M12 2L2 7l10 5 10-5-10-5z"/>
              <path d="M2 17l10 5 10-5"/>
              <path d="M2 12l10 5 10-5"/>
            </svg>
          </span>
          <span className="auth-logo-text">Elect!</span>
        </div>

        <div className="auth-tabs">
          <button className={`auth-tab${tab === 'login' ? ' active' : ''}`} onClick={() => { setTab('login'); clear(); }}>Log In</button>
          <button className={`auth-tab${tab === 'signup' ? ' active' : ''}`} onClick={() => { setTab('signup'); clear(); }}>Sign Up</button>
        </div>

        {error && <div className="auth-error">{error}</div>}
        {success && <div className="auth-success">{success}</div>}

        {/* ── Forgot password flow ── */}
        {fpStep !== 'idle' ? (
          <div>
            {fpStep === 'enter_email' && (
              <>
                <p style={{ fontSize:'.85rem', color:'var(--text-muted)', marginBottom:'1rem', lineHeight:1.5 }}>
                  Enter your email and we will send the verification email for password reset.
                </p>
                <div className="auth-field">
                  <label className="auth-label">Email</label>
                  <input className="auth-input" type="email" placeholder="you@example.com"
                    value={fpEmail} onChange={e => setFpEmail(e.target.value)} autoFocus />
                </div>
                <button className="auth-btn" onClick={handleFpSendCode} disabled={fpLoading}>
                  {fpLoading ? 'Sending…' : 'Send Verification Email'}
                </button>
              </>
            )}
            {fpStep === 'enter_code' && (
              <>
                <p style={{ fontSize:'.85rem', color:'var(--text-muted)', marginBottom:'1rem', lineHeight:1.5 }}>
                  We sent a verification code to <strong>{fpEmail}</strong>. Enter it below.
                </p>
                <div className="auth-field">
                  <label className="auth-label">Verification Code</label>
                  <input className="auth-input" type="text" placeholder="Enter the code from your email"
                    value={fpCode} onChange={e => setFpCode(e.target.value)} autoFocus />
                </div>
                <button className="auth-btn" onClick={handleVerifyOtp} disabled={fpLoading}>
                  {fpLoading ? 'Verifying…' : 'Verify Code'}
                </button>
                <div style={{ marginTop:'.65rem', textAlign:'center' }}>
                  <button style={{ background:'none', border:'none', color:'var(--primary)', fontSize:'.8rem', cursor:'pointer' }}
                    onClick={handleFpSendCode} disabled={fpLoading}>
                    Resend code
                  </button>
                </div>
              </>
            )}
            {fpStep === 'new_password' && (
              <>
                <p style={{ fontSize:'.85rem', color:'var(--text-muted)', marginBottom:'1rem', lineHeight:1.5 }}>
                  You are verified! Set your new password below.
                </p>
                <div className="auth-field">
                  <label className="auth-label">New Password</label>
                  <input className="auth-input" type="password" placeholder="Min. 6 characters"
                    value={fpNewPw} onChange={e => setFpNewPw(e.target.value)} autoFocus minLength={6} />
                </div>
                <button className="auth-btn" onClick={handleFpSetPassword} disabled={fpLoading}>
                  {fpLoading ? 'Saving…' : 'Set New Password'}
                </button>
              </>
            )}
            <div className="auth-divider">
              <button style={{ background:'none', border:'none', color:'var(--primary)', fontWeight:600, cursor:'pointer', fontSize:'.85rem' }}
                onClick={() => { setFpStep('idle'); setError(''); setSuccess(''); }}>
                ← Back to login
              </button>
            </div>
          </div>
        ) : (
          <>
            <form onSubmit={tab === 'login' ? handleLogin : handleSignUp}>
              <div className="auth-field">
                <label className="auth-label">Email</label>
                <input className="auth-input" type="email" placeholder="you@example.com"
                  value={email} onChange={e => setEmail(e.target.value)} required autoFocus />
              </div>
              <div className="auth-field">
                <label className="auth-label">Password</label>
                <input className="auth-input" type="password" placeholder={tab === 'signup' ? 'Min. 6 characters' : '••••••••'}
                  value={password} onChange={e => setPassword(e.target.value)} required minLength={6} />
                {tab === 'login' && (
                  <button type="button" style={{ background:'none', border:'none', color:'var(--primary)', fontSize:'.78rem', cursor:'pointer', marginTop:'.25rem', textAlign:'left' }}
                    onClick={() => { setFpStep('enter_email'); setFpEmail(email); setError(''); setSuccess(''); }}>
                    Forgot password?
                  </button>
                )}
              </div>
              <button className="auth-btn" type="submit" disabled={loading}>
                {loading ? 'Please wait…' : tab === 'login' ? 'Log In' : 'Create Account'}
              </button>
            </form>

            <div className="auth-divider">
              {tab === 'login' ? "Don't have an account? " : 'Already have an account? '}
              <button style={{ background: 'none', border: 'none', color: 'var(--primary)', fontWeight: 600, cursor: 'pointer', fontSize: 'inherit' }}
                onClick={() => { setTab(tab === 'login' ? 'signup' : 'login'); clear(); }}>
                {tab === 'login' ? 'Sign up' : 'Log in'}
              </button>
            </div>

            <div className="auth-divider">or</div>
            <button className="auth-btn" type="button"
              style={{ background:'var(--surface2)', color:'var(--text)', border:'1.5px solid var(--border)' }}
              onClick={onGuest}>
              Continue as Guest 👤
            </button>
            <p style={{ textAlign:'center', fontSize:'.74rem', color:'var(--text-muted)', marginTop:'.5rem', lineHeight:1.4 }}>
              Guest data is not saved and clears when you close the tab.
            </p>
          </>
        )}
      </div>
    </div>
  );
}

function SettingsPanel({ user, profile, onSave, onClose }) {
  const [username, setUsername] = useState(profile?.username || '');
  const [avatarData, setAvatarData] = useState(profile?.avatar_data || null);
  const [saving, setSaving] = useState(false);

  const handleFileChange = (e) => {
    const file = e.target.files?.[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = (ev) => setAvatarData(ev.target.result);
    reader.readAsDataURL(file);
  };

  const handleSave = async () => {
    setSaving(true);
    await onSave({ username: username.trim(), avatar_data: avatarData });
    setSaving(false);
    onClose();
  };

  const initials = user?.email?.slice(0,2).toUpperCase() || '??';

  return (
    <>
      <div className="settings-overlay" onClick={onClose} />
      <div className="settings-panel">
        <div className="settings-header">
          <div className="settings-title">⚙️ Settings</div>
          <button className="settings-close" onClick={onClose}><Icon name="x" size={16} /></button>
        </div>
        <div className="settings-body">
          {/* Avatar */}
          <div>
            <div className="settings-section-label">Profile Picture</div>
            <div className="avatar-wrap">
              <label className="avatar-circle" title="Click to upload a picture">
                {avatarData
                  ? <img src={avatarData} alt="avatar" />
                  : <span>{initials}</span>}
                <input type="file" accept="image/*" style={{ display:'none' }} onChange={handleFileChange} />
              </label>
              <span className="avatar-hint">Click to upload from your device</span>
              {avatarData && (
                <button type="button" onClick={() => setAvatarData(null)}
                  style={{ fontSize:'.78rem', color:'var(--danger)', background:'none', border:'none', cursor:'pointer' }}>
                  Remove photo
                </button>
              )}
            </div>
          </div>

          {/* Username */}
          <div>
            <div className="settings-section-label">Username (optional)</div>
            <input className="auth-input" type="text" placeholder="Enter a display name…"
              value={username} onChange={e => setUsername(e.target.value)} maxLength={40} />
          </div>

          <button className="btn btn-primary" style={{ width:'100%', justifyContent:'center' }}
            onClick={handleSave} disabled={saving}>
            {saving ? 'Saving…' : 'Save Changes'}
          </button>

          {/* Credits */}
          <div className="settings-credits">
            <strong style={{ display:'block', marginBottom:'.35rem' }}>About Elect!</strong>
            Contact <a href="mailto:kan0042@mckinnonsc.vic.edu.au" style={{ color:'var(--primary)' }}>kan0042@mckinnonsc.vic.edu.au</a> for bug reports, false information, suggestions or inconveniences.<br/>
            Website currently being built — incomplete in several areas.<br/>
            Made with HTML by kan0042@mckinnonsc.vic.edu.au and Claude Code.<br/>
            Published with Supabase, Vercel and GitHub.
          </div>
        </div>
      </div>
    </>
  );
}

function Page1({ user, isGuest, submittedData, onSubmit, onSaveIndicator }) {
