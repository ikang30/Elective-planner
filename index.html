  const [language, setLanguage] = useState('');
  const [universities, setUniversities] = useState([]);
  const [desiredElectives, setDesiredElectives] = useState(['']);
  const [skills, setSkills] = useState({ verbal:0, numerical:0, mechanical:0, logical:0, visual:0 });
  const [year9Electives, setYear9Electives] = useState([{ id:'', grade:'' }]);
  const [stemPreference, setStemPreference] = useState(false);
  const [submitted, setSubmitted] = useState(!!submittedData);
  const [suggestions, setSuggestions] = useState(submittedData?.suggestions || []);
  const [dismissAnimating, setDismissAnimating] = useState({});
  const [dismissed, setDismissed] = useState({});
  const [suggestionPool, setSuggestionPool] = useState(submittedData?.pool || []);
  const [isLocked, setIsLocked] = useState(!!submittedData?.isLocked);
  const [showRestartConfirm, setShowRestartConfirm] = useState(false);
  const [lockError, setLockError] = useState('');
  const [swapHistory, setSwapHistory] = useState([]);
  const [manualMode, setManualMode] = useState(false);
  const [essentialRemoveChoice, setEssentialRemoveChoice] = useState({});
  const [enhancementSlot, setEnhancementSlot] = useState('');
  const [enhancementSubject, setEnhancementSubject] = useState('');

  // ── Bug fix: sync local state when DB data loads after a refresh ──
  useEffect(() => {
    if (submittedData && !submitted) {
      setSuggestions(submittedData.suggestions || []);
      setSuggestionPool(submittedData.pool || []);
      setIsLocked(!!submittedData.isLocked);
      setSwapHistory([]);
      setLangDisplaced(
        (submittedData.suggestions || []).reduce((acc, s, i) => {
          if (s?.id?.startsWith('lang_')) acc[i] = null;
          return acc;
        }, {})
      );
      setSubmitted(true);
    }
  }, [submittedData]);
  // Per-slot language replacements: { slotIndex: displaced_elective | null }
  // null = slot is language-replaced but original unknown (loaded from DB)
  const [langDisplaced, setLangDisplaced] = useState(() =>
    (submittedData?.suggestions || []).reduce((acc, s, i) => {
      if (s?.id?.startsWith('lang_')) acc[i] = null;
      return acc;
    }, {})
  );

  const toggleUni = (uni) => setUniversities(prev => {
    if (prev.includes(uni)) return prev.filter(u => u !== uni); // always allow deselect
    if (prev.length >= 2) return prev;                          // cap at 2
    return [...prev, uni];
  });

  const addDesiredElective = () => { if (desiredElectives.length < 3) setDesiredElectives(prev => [...prev, '']); };
  const removeDesiredElective = (i) => setDesiredElectives(prev => prev.filter((_, idx) => idx !== i));
  const setDesiredElective = (i, val) => setDesiredElectives(prev => { const n = [...prev]; n[i] = val; return n; });

  const savePlan = async (data) => {
    onSubmit(data);
    try {
      if (user) await dbSaveElectiveResults(user.id, data);
      else if (isGuest) saveToGuest(data);
      onSaveIndicator();
    } catch (err) {
      console.error('Save failed', err);
      if (user) {
        const cached = readAccountCache(user.id) || {};
        writeAccountCache(user.id, { ...cached, submittedData: data, checklistState: cached.checklistState || {} });
      }
      onSaveIndicator();
    }
  };

  const handleSubmit = async (e) => {
    e.preventDefault();
    const studentData = {
      grades, careerCategory: career,
      desiredElectives: desiredElectives.filter(Boolean),
      language, universities, yearLevel: '10',
      skills, year9Electives: year9Electives.filter(r => r.id && r.grade),
      stemPreference,
    };
    const pts = runAlgorithm(studentData);
    const top8 = buildYear10Selection(pts, studentData);
    const top8Ids = new Set(top8.map(e => e.id));
    // Pool sorted by category score so best remaining options appear first in swap
    const pool = ALL_ELECTIVES
      .filter(e => !top8Ids.has(e.id))
      .sort((a, b) => (pts[ELECTIVE_CAT_MAP[b.id]] || 0) - (pts[ELECTIVE_CAT_MAP[a.id]] || 0));
    // Track which top-8 electives were boosted by a Y9 match
    const boostIds = new Set(
      studentData.year9Electives
        .map(r => Y9_TO_Y10[r.id])
        .filter(id => id && top8Ids.has(id))
    );
    const newStudentData = { ...studentData, year9BoostIds: [...boostIds] };
    const data = { studentData: newStudentData, suggestions: top8, pool, isLocked: false };
    setSuggestions(top8); setSuggestionPool(pool); setIsLocked(false); setSubmitted(true);
    await savePlan(data);
  };

  const handleDismiss = useCallback((electiveId) => {
    if (isLocked) return;
    const oldIndex = suggestions.findIndex(e => e.id === electiveId);
    const oldElective = suggestions[oldIndex];
    if (oldIndex < 0 || !oldElective) return;
    setDismissAnimating(prev => ({ ...prev, [electiveId]: true }));
    setTimeout(async () => {
      const usedIds = new Set(suggestions.map(e => e.id));
      const usedPoolIds = new Set(Object.keys(dismissed));
      const next = suggestionPool.find(e => !usedIds.has(e.id) && !usedPoolIds.has(e.id));
      const newSuggestions = [...suggestions];
      if (next) newSuggestions[oldIndex] = next;
      else newSuggestions.splice(oldIndex, 1);
      const newPool = next ? suggestionPool.filter(e => e.id !== next.id) : suggestionPool;
      setSuggestions(newSuggestions);
      setSuggestionPool(newPool);
      setSwapHistory(prev => [{ index: oldIndex, original: oldElective, replacement: next || null }, ...prev].slice(0, 8));
      setDismissed(prev => ({ ...prev, [electiveId]: true }));
      setDismissAnimating(prev => { const n = { ...prev }; delete n[electiveId]; return n; });
      const updData = { studentData: submittedData?.studentData, suggestions: newSuggestions, pool: newPool, isLocked: false };
      await savePlan(updData);
    }, 300);
  }, [suggestions, suggestionPool, dismissed, isLocked, user, isGuest, submittedData]);

  const handleRestoreSwap = async (entryIndex = 0) => {
    if (isLocked || !swapHistory[entryIndex]) return;
    const entry = swapHistory[entryIndex];
    const newSuggestions = [...suggestions];
    const replacementNow = newSuggestions[entry.index];
    newSuggestions[entry.index] = entry.original;
    const newPool = replacementNow && !replacementNow.id?.startsWith('lang_')
      ? [replacementNow, ...suggestionPool.filter(e => e.id !== replacementNow.id)]
      : suggestionPool;
    setSuggestions(newSuggestions);
    setSuggestionPool(newPool);
    setSwapHistory(prev => prev.filter((_, i) => i !== entryIndex));
    setLockError('');
    await savePlan({ studentData: submittedData?.studentData, suggestions: newSuggestions, pool: newPool, isLocked: false });
  };

  const handleReplaceEssential = async (type, id) => {
    if (isLocked || !id || suggestions.some(e => e.id === id)) return;
    const ids = type === 'humanities' ? HUMANITIES_IDS : type === 'science' ? SCIENCE_IDS : PE_IDS;
    const currentInGroup = suggestions.filter(e => ids.includes(e.id));
    const chosenRemoveId = essentialRemoveChoice[type];
    const removeId = currentInGroup.some(e => e.id === chosenRemoveId)
      ? chosenRemoveId
      : currentInGroup[0]?.id;
    const idx = suggestions.findIndex(e => e.id === removeId);
    if (idx < 0) return;
    const replacement = ALL_ELECTIVES.find(e => e.id === id);
    if (!replacement) return;
    const original = suggestions[idx];
    const newSuggestions = [...suggestions];
    newSuggestions[idx] = replacement;
    const newPool = [original, ...suggestionPool.filter(e => e.id !== id)];
    setSuggestions(newSuggestions);
    setSuggestionPool(newPool);
    setSwapHistory(prev => [{ index: idx, original, replacement }, ...prev].slice(0, 8));
    setEssentialRemoveChoice(prev => ({ ...prev, [type]: undefined }));
    setLockError('');
    await savePlan({ studentData: submittedData?.studentData, suggestions: newSuggestions, pool: newPool, isLocked: false });
  };

  const toggleManualElective = async (id) => {
    if (isLocked) return;
    const exists = suggestions.some(e => e.id === id);
    let newSuggestions;
    if (exists) {
      newSuggestions = suggestions.filter(e => e.id !== id);
    } else {
      if (suggestions.length >= 8) return;
      const elective = ALL_ELECTIVES.find(e => e.id === id);
      if (!elective) return;
      newSuggestions = [...suggestions, elective];
    }
    const selectedIds = new Set(newSuggestions.map(e => e.id));
    const newPool = ALL_ELECTIVES.filter(e => !selectedIds.has(e.id));
    setSuggestions(newSuggestions);
    setSuggestionPool(newPool);
    setLockError('');
    await savePlan({ studentData: submittedData?.studentData, suggestions: newSuggestions, pool: newPool, isLocked: false });
  };

  const handleLockIn = async () => {
    const missing = [];
    if (suggestions.length !== 8) missing.push('exactly 8 elective units');
    if (!suggestions.some(e => HUMANITIES_IDS.includes(e.id))) missing.push('Geography or History');
    if (!suggestions.some(e => SCIENCE_IDS.includes(e.id)))    missing.push('a Science elective');
    if (!suggestions.some(e => PE_IDS.includes(e.id)))         missing.push('a PE elective');
    if (missing.length > 0) {
      setLockError(`Your plan is missing: ${missing.join(', ')}. Please swap those slots back to meet the required standards before locking in.`);
      return;
    }
    setLockError('');
    setIsLocked(true); setShowRestartConfirm(false);
    const data = { studentData: submittedData?.studentData, suggestions, pool: suggestionPool, isLocked: true };
    await savePlan(data);
  };

  const handleRestartConfirmed = async () => {
    setSubmitted(false); setSuggestions([]); setSuggestionPool([]);
    setDismissed({}); setIsLocked(false); setShowRestartConfirm(false);
    setSwapHistory([]); setManualMode(false); setEssentialRemoveChoice({});
    setEnhancementSlot(''); setEnhancementSubject('');
    setLangDisplaced({});
    setDesiredElectives(['']); setGrades(Object.fromEntries(CORE_SUBJECTS.map(s => [s, ''])));
    setCareer(''); setLanguage(''); setUniversities([]);
    setSkills({ verbal:0, numerical:0, mechanical:0, logical:0, visual:0 });
    setYear9Electives([{ id:'', grade:'' }]);
    setStemPreference(false);
    onSubmit(null);
    if (user) { await dbClearResults(user.id); localStorage.removeItem(accountCacheKey(user.id)); onSaveIndicator(); }
    else if (isGuest) { sessionStorage.removeItem('elect_guest_data'); onSaveIndicator(); }
  };

  /* ── Per-slot language swap helpers ─────────────────────────
     Students can replace any non-compulsory slot with their
     Year 9 language continuation (max 2 slots = 2 language units).
     Compulsory slots (the sole humanities, sole science, sole PE)
     are protected and show a "Required" tag instead of a swap button.
  ── */

  // Which suggestion IDs are currently protecting a minimum requirement
  const compulsoryIds = (() => {
    const s = new Set();
    const hum = suggestions.filter(e => HUMANITIES_IDS.includes(e.id));
    const sci = suggestions.filter(e => SCIENCE_IDS.includes(e.id));
    const pe  = suggestions.filter(e => PE_IDS.includes(e.id));
    if (hum.length <= 1 && hum[0]) s.add(hum[0].id);
    if (sci.length <= 1 && sci[0]) s.add(sci[0].id);
    if (pe.length  <= 1 && pe[0])  s.add(pe[0].id);
    return s;
  })();

  const langSlotCount = suggestions.filter(s => s?.id?.startsWith('lang_')).length;
  const hasLanguage = langSlotCount > 0;

  const handleAddLanguage = async () => {
    const lang = submittedData?.studentData?.language;
    if (!lang || isLocked) return;
    // Find last 2 non-compulsory, non-language slots (those are the weakest matches)
    const available = [];
    for (let i = suggestions.length - 1; i >= 0 && available.length < 2; i--) {
      const s = suggestions[i];
      if (!compulsoryIds.has(s.id) && !s.id?.startsWith('lang_')) available.unshift({ idx: i, s });
    }
    if (available.length < 2) return;
    const newSugs = [...suggestions];
    const newDisplaced = { ...langDisplaced };
    available.forEach(({ idx, s }, unit) => {
      const langPathway = getLanguagePathway(lang);
      newDisplaced[idx] = s;
      newSugs[idx] = {
        id: `lang_${idx}`,
        name: `${lang} — Unit ${unit + 1}`,
        category: 'language', badge: 'badge-language',
        description: `Year 10 ${lang} continuation — Unit ${unit + 1}. Building on Year 9 ${lang} vocabulary, grammar and conversational skills.`,
        careers: langPathway.careers,
        universities: langPathway.universities,
      };
    });
    setLangDisplaced(newDisplaced);
    setSuggestions(newSugs);
    const data = { studentData: submittedData?.studentData, suggestions: newSugs, pool: suggestionPool, isLocked };
    await savePlan(data);
  };

  const handleRemoveLanguage = async () => {
    const newSugs = [...suggestions];
    let anyRestored = false;
    Object.entries(langDisplaced).forEach(([idx, original]) => {
      if (original && newSugs[Number(idx)]?.id?.startsWith('lang_')) {
        newSugs[Number(idx)] = original; anyRestored = true;
      }
    });
    if (!anyRestored) return;
    setLangDisplaced({});
    setSuggestions(newSugs);
    const data = { studentData: submittedData?.studentData, suggestions: newSugs, pool: suggestionPool, isLocked };
    await savePlan(data);
  };

  const handleApplyEnhancement = async () => {
    if (enhancementSlot === '' || !enhancementSubject) return;
    const idx = Number(enhancementSlot);
    const original = suggestions[idx];
    if (!original || isEnhancementElective(original) || compulsoryIds.has(original.id)) return;
    const newSugs = [...suggestions];
    newSugs[idx] = makeEnhancementElective(enhancementSubject, original);
    setSuggestions(newSugs);
    setEnhancementSlot('');
    setEnhancementSubject('');
    setLockError('');
    await savePlan({ studentData: submittedData?.studentData, suggestions: newSugs, pool: suggestionPool, isLocked });
  };

  const handleRestoreEnhancement = async (idx) => {
    const current = suggestions[idx];
    const original = current?._enhOriginalId ? ALL_ELECTIVES.find(e => e.id === current._enhOriginalId) : null;
    if (!original) return;
    const newSugs = [...suggestions];
    newSugs[idx] = original;
    setSuggestions(newSugs);
    setLockError('');
    await savePlan({ studentData: submittedData?.studentData, suggestions: newSugs, pool: suggestionPool, isLocked });
  };

  const humCount = suggestions.filter(e => HUMANITIES_IDS.includes(e.id)).length;
  const sciCount = suggestions.filter(e => SCIENCE_IDS.includes(e.id)).length;
  const peCount  = suggestions.filter(e => PE_IDS.includes(e.id)).length;

  return (
    <div className="page">
      <div className="page-header">
        <div className="page-title">{submitted ? 'Your Year 10 Elective Profile' : 'Plan Your Year 10 Electives'}</div>
        <div className="page-subtitle">
          {submitted ? "Your personalised elective suggestions are below. Swap any you're not happy with."
                     : "Tell us about yourself and we'll suggest the best electives for your goals."}
        </div>
      </div>

      <div className="accuracy-warning">
        <Icon name="alert-triangle" size={18} />
        <span>
          <strong>Important: these suggestions may be very inaccurate.</strong>
          This algorithm is not professional advice. Use the generated plan as a rough starting point, review every subject yourself, swap or manually change anything that feels wrong, then lock in only when the final 8 choices genuinely fit you.
        </span>
      </div>

      {!submitted ? (
        <form onSubmit={handleSubmit}>
          {/* GRADES */}
          <div className="card">
            <div className="card-title">
              <span className="icon-wrap" style={{ background:'#ede9fe' }}><Icon name="book-open" size={14} /></span>
              Core Subject Grades
            </div>
            <div className="grade-grid">
              {CORE_SUBJECTS.map(subject => (
                <div className="grade-cell" key={subject}>
                  <label>{subject}</label>
                  <select className="form-select" value={grades[subject]} onChange={e => setGrades(prev => ({ ...prev, [subject]: e.target.value }))}>
                    {GRADE_OPTIONS.map(o => <option key={o.value} value={o.value}>{o.label}</option>)}
                  </select>
                </div>
              ))}
            </div>
          </div>

          <div className="form-two-col">
            {/* CAREER */}
            <div className="card">
              <div className="card-title">
                <span className="icon-wrap" style={{ background:'#fef3c7' }}><Icon name="briefcase" size={14} /></span>
                Career Category
              </div>
              <select className="form-select" value={career} onChange={e => setCareer(e.target.value)} required>
                <option value="">Choose a career area…</option>
                {CAREER_CATEGORIES.map(c => <option key={c} value={c}>{c}</option>)}
              </select>
            </div>

            {/* LANGUAGE */}
            <div className="card">
              <div className="card-title">
                <span className="icon-wrap" style={{ background:'#d1fae5' }}><Icon name="globe" size={14} /></span>
                Language in Year 9
              </div>
              <select className="form-select" value={language} onChange={e => setLanguage(e.target.value)}>
                <option value="">No language taken</option>
                <option value="Spanish">Spanish</option>
                <option value="French">French</option>
                <option value="German">German</option>
              </select>
              <p style={{ marginTop:'.6rem', fontSize:'.8rem', color:'var(--text-muted)', lineHeight:1.5 }}>
                If you studied a language in Year 9, you may be able to continue it as an elective.
              </p>
            </div>
          </div>

          {/* DESIRED ELECTIVES */}
          <div className="card" style={{ marginTop:'1.25rem' }}>
            <div className="card-title">
              <span className="icon-wrap" style={{ background:'#fef9c3' }}><Icon name="star" size={14} /></span>
              Desired Electives
              <span style={{ fontWeight:400, fontSize:'.77rem', color:'var(--text-muted)', marginLeft:'.25rem' }}>
                (optional — up to 3, passed to your algorithm)
              </span>
            </div>
            {desiredElectives.map((val, i) => (
              <div className="desired-elective-row" key={i}>
                <select className="form-select" value={val} onChange={e => setDesiredElective(i, e.target.value)}>
                  <option value="">Any preference…</option>
                  {ALL_ELECTIVES.map(e => <option key={e.id} value={e.id}>{e.name}</option>)}
                </select>
                {desiredElectives.length > 1 && (
                  <button type="button" className="remove-btn" onClick={() => removeDesiredElective(i)}><Icon name="x" size={14} /></button>
                )}
              </div>
            ))}
            {desiredElectives.length < 3 && (
              <button type="button" className="add-elective-btn" onClick={addDesiredElective}>
                <Icon name="plus" size={14} /> Add preference
              </button>
            )}
          </div>

          {/* UNIVERSITIES */}
          <div className="card" style={{ marginTop:'1.25rem' }}>
            <div className="card-title">
              <span className="icon-wrap" style={{ background:'#fee2e2' }}><Icon name="award" size={14} /></span>
              Preferred Universities
              <span style={{ fontWeight:400, fontSize:'.77rem', color:'var(--text-muted)', marginLeft:'.25rem' }}>
                (choose up to 2 — {universities.length}/2 selected)
              </span>
            </div>
            <div className="uni-section-label">Australian Universities</div>
            <div className="multi-chip-grid">
              {UNIVERSITIES_AU.map(uni => {
                const sel = universities.includes(uni);
                const capped = !sel && universities.length >= 2;
                return <button type="button" key={uni}
                  className={`multi-chip${sel?' selected':''}${capped?' chip-disabled':''}`}
                  onClick={() => toggleUni(uni)}>{uni}</button>;
              })}
            </div>
            <div className="uni-section-label">International Universities</div>
            <div className="multi-chip-grid">
              {UNIVERSITIES_INTL.map(uni => {
                const sel = universities.includes(uni);
                const capped = !sel && universities.length >= 2;
                return <button type="button" key={uni}
                  className={`multi-chip${sel?' selected':''}${capped?' chip-disabled':''}`}
                  onClick={() => toggleUni(uni)}>{uni}</button>;
              })}
            </div>
          </div>

          {/* ── GENUINE SKILLS ── */}
          <div className="card" style={{ marginTop:'1.25rem' }}>
            <div className="card-title">
              <span className="icon-wrap" style={{ background:'#e0e7ff' }}><Icon name="trending-up" size={14} /></span>
              Genuine Skills
              <span style={{ fontWeight:400, fontSize:'.77rem', color:'var(--text-muted)', marginLeft:'.25rem' }}>
                (rate yourself 1–5 stars in each)
              </span>
            </div>
            <div className="skills-grid">
              {['verbal','numerical','mechanical','logical','visual'].map(skill => (
                <div className="skill-item" key={skill}>
                  <div className="skill-label">{skill.charAt(0).toUpperCase()+skill.slice(1)}</div>
                  <div className="skill-stars">
                    {[1,2,3,4,5].map(n => (
                      <button type="button" key={n}
                        className={`skill-star${skills[skill] >= n ? ' filled' : ''}`}
                        onClick={() => setSkills(prev => ({ ...prev, [skill]: prev[skill] === n ? 0 : n }))}>
                        ★
                      </button>
                    ))}
                  </div>
                </div>
              ))}
            </div>
          </div>

          {/* ── YEAR 9 ELECTIVES ── */}
          <div className="card" style={{ marginTop:'1.25rem' }}>
            <div className="card-title">
              <span className="icon-wrap" style={{ background:'#d1fae5' }}><Icon name="clock" size={14} /></span>
              Year 9 Electives
              <span style={{ fontWeight:400, fontSize:'.77rem', color:'var(--text-muted)', marginLeft:'.25rem' }}>
                (optional — up to 4, helps personalise your suggestions)
              </span>
            </div>
            {year9Electives.map((row, i) => (
              <div className="y9-row" key={i}>
                <select className="form-select" value={row.id}
                  onChange={e => setYear9Electives(prev => { const n=[...prev]; n[i]={...n[i],id:e.target.value}; return n; })}>
                  <option value="">Select a Year 9 elective…</option>
                  {Y9_ELECTIVES.map(e => <option key={e.id} value={e.id}>{e.name}</option>)}
                </select>
                <select className="form-select" value={row.grade}
                  onChange={e => setYear9Electives(prev => { const n=[...prev]; n[i]={...n[i],grade:e.target.value}; return n; })}>
                  {GRADE_OPTIONS.map(o => <option key={o.value} value={o.value}>{o.label}</option>)}
                </select>
                {year9Electives.length > 1 && (
                  <button type="button" className="remove-btn"
                    onClick={() => setYear9Electives(prev => prev.filter((_,idx)=>idx!==i))}>
                    <Icon name="x" size={14} />
                  </button>
                )}
                {year9Electives.length === 1 && <div />}
              </div>
            ))}
            {year9Electives.length < 4 && (
              <button type="button" className="add-elective-btn"
                onClick={() => setYear9Electives(prev => [...prev, { id:'', grade:'' }])}>
                <Icon name="plus" size={14} /> Add another
              </button>
            )}
          </div>

          {/* ── STEM PREFERENCE ── */}
          <div className="card" style={{ marginTop:'1.25rem' }}>
            <div className="card-title">
              <span className="icon-wrap" style={{ background:'#d1fae5' }}><Icon name="cpu" size={14} /></span>
              Want a STEM-focused selection?
            </div>
            <div className="stem-toggle-row">
              <button type="button" className={`stem-btn yes${stemPreference ? ' active' : ''}`}
                onClick={() => setStemPreference(true)}>O — Yes, STEM please</button>
              <button type="button" className={`stem-btn no${!stemPreference ? ' active' : ''}`}
                onClick={() => setStemPreference(false)}>X — No thanks</button>
            </div>
            <p style={{ marginTop:'.6rem', fontSize:'.8rem', color:'var(--text-muted)', lineHeight:1.5 }}>
              Selecting STEM boosts Science, Maths and Engineering-related electives in your suggestions.
            </p>
          </div>

          <div className="submit-row">
            <button type="submit" className="btn btn-primary"><Icon name="zap" size={16} /> Generate My Elective Plan</button>
            <span style={{ fontSize:'.81rem', color:'var(--text-muted)' }}>Year 10 · 8 elective units</span>
          </div>
        </form>

      ) : (
        <>
          <div className="req-bars">
            <RequirementBar label="Geo / History (min 1)" filled={humCount} total={1} color="#92400e" />
            <RequirementBar label="Science (min 1)"    filled={sciCount} total={1} color="#065f46" />
            <RequirementBar label="PE (min 1)"         filled={peCount}  total={1} color="#991b1b" />
            <RequirementBar label="Total Units"        filled={suggestions.length} total={8} color="#4338ca" />
          </div>

          {isLocked ? (
            <div className="locked-banner">
              🎉 Congrats! Your Year 10 electives are locked in — you&apos;re all set! Some features just unlocked too — go check them out on the other pages! Good luck! 🐧
            </div>
          ) : (
            <div className="info-banner">
              <Icon name="info" size={15} />
              Not happy with a suggestion? Hit <strong style={{ margin:'0 .3rem' }}>Swap</strong> to replace it with the next best match.
              When you&apos;re happy with all 8, click <strong style={{ margin:'0 .3rem' }}>Lock In</strong>. ✨
            </div>
          )}

          {(() => {
            const y9Boost = new Set(submittedData?.studentData?.year9BoostIds || []);
            return (
          <div className="suggestions-grid">
            {suggestions.map((elective, idx) => (
              <SuggestionCard key={elective.id + idx} elective={elective} index={idx}
                isAnimatingOut={!!dismissAnimating[elective.id]}
                onDismiss={() => handleDismiss(elective.id)}
                locked={isLocked}
                language={submittedData?.studentData?.language || null}
                isCompulsory={compulsoryIds.has(elective.id)}
                isLangCard={!!elective.id?.startsWith('lang_')}
                displacedName={langDisplaced[idx]?.name}
                isLast2={idx >= 6}
                isFromY9={y9Boost.has(elective.id)}
              />
            ))}
          </div>
            );
          })()}

          {!isLocked && swapHistory.length > 0 && (
            <div className="info-banner" style={{ marginTop:'1rem', marginBottom:0, justifyContent:'space-between', flexWrap:'wrap' }}>
              <span>
                <Icon name="rotate-ccw" size={15} /> Need that last subject back?
                Restore <strong>{swapHistory[0].original.name}</strong>
                {swapHistory[0].replacement ? <> instead of <strong>{swapHistory[0].replacement.name}</strong></> : null}.
              </span>
              <button className="restore-btn" onClick={() => handleRestoreSwap(0)}>
                <Icon name="rotate-ccw" size={13} /> Re-swap back
              </button>
            </div>
          )}

          {!isLocked && (
            <div className="essential-panel">
              <div className="card-title" style={{ marginBottom:0 }}>
                <span className="icon-wrap" style={{ background:'#eef2ff' }}><Icon name="sliders" size={14} /></span>
                Essential requirement choices
              </div>
              <p style={{ marginTop:'.45rem', fontSize:'.82rem', color:'var(--text-muted)', lineHeight:1.5 }}>
                Keep the required categories, but choose the subject inside them. For example: Geography ↔ History, Biology ↔ Chemistry, or a different PE option.
              </p>
              <div className="essential-grid">
                {[
                  { key:'humanities', title:'Geo / History', ids:HUMANITIES_IDS },
                  { key:'science', title:'Science', ids:SCIENCE_IDS },
                  { key:'pe', title:'PE', ids:PE_IDS },
                ].map(group => {
                  const current = suggestions.filter(s => group.ids.includes(s.id));
                  const currentIds = new Set(current.map(e => e.id));
                  const chosenRemove = essentialRemoveChoice[group.key] || current[0]?.id || '';
                  const choices = group.ids
                    .map(id => ALL_ELECTIVES.find(e => e.id === id))
                    .filter(Boolean);
                  const visibleChoices = current.length > 1
                    ? choices.filter(e => !currentIds.has(e.id))
                    : choices;

                  return (
                    <div key={group.key}>
                      <div className="essential-title">{group.title}</div>

                      {current.length > 1 && (
                        <div style={{ marginBottom:'.55rem' }}>
                          <label style={{ display:'block', fontSize:'.72rem', color:'var(--text-muted)', marginBottom:'.25rem' }}>
                            If adding a new choice, replace:
                          </label>
                          <select
                            className="form-select"
                            style={{ padding:'.42rem .6rem', fontSize:'.8rem' }}
                            value={chosenRemove}
                            onChange={e => setEssentialRemoveChoice(prev => ({ ...prev, [group.key]: e.target.value }))}
                          >
                            {current.map(e => <option key={e.id} value={e.id}>{e.name}</option>)}
                          </select>
                        </div>
                      )}

                      <div className="essential-options">
                        {visibleChoices.length === 0 ? (
                          <span style={{ fontSize:'.75rem', color:'var(--text-muted)', lineHeight:1.4 }}>
                            All choices in this required group are already in your plan.
                          </span>
                        ) : visibleChoices.map(e => {
                          const active = current.some(s => s.id === e.id);
                          return (
                            <button
                              key={e.id}
                              className={`essential-chip${active ? ' active' : ''}`}
                              onClick={() => handleReplaceEssential(group.key, e.id)}
                              title={active ? 'Already in your plan' : `Swap to ${e.name}`}
                            >
                              {e.name}
                            </button>
                          );
                        })}
                      </div>
                    </div>
                  );
                })}
              </div>
            </div>
          )}

          {submittedData?.studentData?.language && (
            <div className="language-note">
              <div className="language-note-icon">🌐</div>
              <div style={{ flex: 1 }}>
                <div className="language-note-title">
                  {submittedData.studentData.language} Continuation Available
                  {hasLanguage && (
                    <span className="lang-swapped-badge" style={{ marginLeft: '.65rem' }}>
                      2 units added ✓
                    </span>
                  )}
                </div>
                <div className="language-note-text">
                  Because you studied <strong>{submittedData.studentData.language}</strong> in Year 9, you can add it as a Year 10 continuation.
                  Languages take <strong>2 units</strong> — this will replace 2 elective slots in your selection (your two weakest matches).
                  {!isLocked && !hasLanguage && (
                    <> Compulsory slots (Geo/History, Science, PE) are protected.</>
                  )}
                  {isLocked && !hasLanguage && " Restart if you’d like to make this change."}
                  {hasLanguage && ' Speak to your coordinator to confirm language enrolment.'}
                </div>
                {!isLocked && (
                  <div style={{ marginTop: '.75rem', display:'flex', gap:'.5rem', flexWrap:'wrap' }}>
                    {!hasLanguage
                      ? <button className="btn-lang-swap" onClick={handleAddLanguage}>🌐 Add {submittedData.studentData.language} (2 units)</button>
                      : <button className="btn-lang-undo" onClick={handleRemoveLanguage}>↩ Remove Language</button>
                    }
                  </div>
                )}
              </div>
            </div>
          )}

          {/* ── ENHANCEMENT BANNER ──
              Shown only when English > 70 AND maths or science > 85.
              Allows one suggested/locked slot to become a Year 11 Unit 1/2 enhancement. */}
          {(() => {
            const g = submittedData?.studentData?.grades || {};
            const eng  = Number(g['English']     || 0);
            const math = Number(g['Mathematics']  || 0);
            const sci  = Number(g['Science']      || 0);
            const showMaths = eng > 70 && math > 85;
            const showSci   = eng > 70 && sci  > 85;
            if (!showMaths && !showSci) return null;
            const sciElective = suggestions.find(e => SCIENCE_IDS.includes(e.id));
            const sciLabel = sciElective ? sciElective.name : 'Science';
            const enhancementOptions = getYear11EnhancementOptions(showMaths, showSci);
            const replaceableOptions = suggestions
              .map((elective, idx) => ({ elective, idx }))
              .filter(({ elective }) => elective && !isEnhancementElective(elective) && !compulsoryIds.has(elective.id));
            const activeEnhancements = suggestions
              .map((elective, idx) => ({ elective, idx }))
              .filter(({ elective }) => isEnhancementElective(elective));
            return (
              <div className="enhancement-banner">
                <div className="enhancement-banner-icon">⭐</div>
                <div style={{ flex: 1 }}>
                  <div className="enhancement-banner-title">Enhancement Opportunity</div>
                  <div className="enhancement-banner-text">
                    Based on your strong grades, you might want to consider taking{' '}
                    {showMaths && showSci ? (
                      <><strong>enhancement Year 11 Mathematics</strong> and <strong>enhancement Year 11 {sciLabel}</strong></>
                    ) : showMaths ? (
                      <strong>enhancement Year 11 Mathematics</strong>
                    ) : (
                      <strong>enhancement Year 11 {sciLabel}</strong>
                    )}{' '}
                    classes in Year 10. Speak to your subject coordinator about acceleration and enrichment options.
                  </div>

                  <div className="enhancement-actions">
                    <div className="enhancement-field">
                      <label>Elective to replace</label>
                      <select className="form-select" value={enhancementSlot} onChange={e => setEnhancementSlot(e.target.value)}>
                        <option value="">Choose a non-essential slot...</option>
                        {replaceableOptions.map(({ elective, idx }) => (
                          <option key={`${elective.id}-${idx}`} value={idx}>Slot {idx + 1}: {elective.name}</option>
                        ))}
                      </select>
                    </div>
                    <div className="enhancement-field">
                      <label>Enhancement subject</label>
                      <select className="form-select" value={enhancementSubject} onChange={e => setEnhancementSubject(e.target.value)}>
                        <option value="">Choose Year 11 Unit 1/2...</option>
                        {enhancementOptions.map(subject => <option key={subject} value={subject}>{subject}</option>)}
                      </select>
                    </div>
                    <button
                      className="btn btn-primary"
                      onClick={handleApplyEnhancement}
                      disabled={enhancementSlot === '' || !enhancementSubject}
                      style={{ whiteSpace:'nowrap', opacity: enhancementSlot === '' || !enhancementSubject ? .55 : 1 }}
                    >
                      <Icon name="repeat" size={14} /> Replace
                    </button>
                  </div>

                  {replaceableOptions.length === 0 && (
                    <div className="enhancement-note">
                      There are no safe non-essential slots to replace right now. Keep at least one Geo/History, Science and PE subject in the plan before using an enhancement.
                    </div>
                  )}

                  <div className="enhancement-note">
                    Enhancement subjects can be stored in your plan before or after locking in. Page 2 will leave outside programs, career/university links and curriculum checklist data blank for enhancement subjects because that information has not been added yet.
                  </div>

                  {activeEnhancements.length > 0 && (
                    <div className="enhancement-restore-row">
                      {activeEnhancements.map(({ elective, idx }) => (
                        <button key={`${elective.id}-${idx}`} className="enhancement-restore-btn" onClick={() => handleRestoreEnhancement(idx)}>
                          Restore slot {idx + 1}: {elective.name}
                        </button>
                      ))}
                    </div>
                  )}
                </div>
              </div>
            );
          })()}

          {lockError && (
            <div className="auth-error" style={{ marginBottom: '1rem' }}>
              ⚠️ {lockError}
            </div>
          )}

          {!isLocked && (
            <div className="manual-panel">
              <div className="manual-panel-header">
                <div>
                  <div className="card-title" style={{ marginBottom:'.25rem' }}>
                    <span className="icon-wrap" style={{ background:'#fef3c7' }}><Icon name="edit-3" size={14} /></span>
                    Still not satisfied after swapping multiple times?
                  </div>
                  <p style={{ fontSize:'.84rem', color:'var(--text-muted)', lineHeight:1.55 }}>
                    My bad, the algorithm must have an error there or something. Choose your own 8 electives!
                  </p>
                </div>
                <button className="btn btn-secondary" onClick={() => setManualMode(v => !v)}>
                  {manualMode ? 'Hide Choices' : 'Choose Myself'}
                </button>
              </div>
              {manualMode && (
                <>
                  <div className="manual-grid">
                    {ALL_ELECTIVES.map(e => {
                      const selected = suggestions.some(s => s.id === e.id);
                      const disabled = !selected && suggestions.length >= 8;
                      return (
                        <button key={e.id} className={`manual-pick${selected ? ' selected' : ''}`}
                          disabled={disabled}
                          style={disabled ? { opacity:.45, cursor:'not-allowed' } : null}
                          onClick={() => toggleManualElective(e.id)}>
                          <span>{e.name}</span>
                          <span>{selected ? '✓' : '+'}</span>
                        </button>
                      );
                    })}
                  </div>
                  <div className="manual-summary">
                    <span><strong>{suggestions.length}/8</strong> selected</span>
                    <span>Geo/History: <strong>{humCount}</strong></span>
                    <span>Science: <strong>{sciCount}</strong></span>
                    <span>PE: <strong>{peCount}</strong></span>
                    <span>You still need all three required categories before locking in.</span>
                  </div>
                </>
              )}
            </div>
          )}

          <div className="lock-action-row">
            {!isLocked && <button className="btn btn-lock" onClick={handleLockIn}><Icon name="lock" size={15} /> Lock In?</button>}
            {!showRestartConfirm && (
              <button className="btn btn-secondary" onClick={() => setShowRestartConfirm(true)}><Icon name="refresh-cw" size={15} /> Restart?</button>
            )}
            {showRestartConfirm && (
              <div className="restart-confirm">
                <span>Are you sure? {isLocked ? 'Your locked choices' : 'Everything'} will be cleared.</span>
                <div className="restart-confirm-btns">
                  <button className="btn-confirm-yes" onClick={handleRestartConfirmed}>Yes, restart</button>
                  <button className="btn-confirm-no" onClick={() => setShowRestartConfirm(false)}>Cancel</button>
                </div>
              </div>
            )}
            <span style={{ fontSize:'.81rem', color:'var(--text-muted)', marginLeft:'auto' }}>
              {suggestions.length} / 8 units {isLocked ? '🔒 locked' : 'selected'}
            </span>
          </div>
        </>
      )}
    </div>
  );
}

function SuggestionCard({
  elective, index, isAnimatingOut, onDismiss, locked,
  language, isCompulsory, isLangCard, displacedName, isLast2, isFromY9,
}) {
  const categoryLabel = {
    english_faculty:  'English',
    humanities:       'Humanities',
    science:          'Science',
    pe:               'Physical Ed',
    visual_arts:      'Visual Arts',
    performing_arts:  'Performing Arts',
    health:           'Health',
    ict:              'ICT',
    language:         'Language Continuation',
    enhancement:      'Enhancement',
  }[elective.category] || elective.category;

  return (
    <div
      className={`suggestion-card${isAnimatingOut ? ' dismissed' : ''}`}
      style={{
        animationDelay: `${index * 55}ms`,
        // Subtle dim on the two weakest-match slots to hint at language replacement
        opacity: isLast2 && language && !isLangCard && !locked ? 0.88 : 1,
        borderColor: isLangCard ? '#fde68a' : undefined,
      }}
    >
      <div className="sug-header">
        <div className="sug-subject-name">
          {elective.name}
          {isLast2 && language && !isLangCard && !locked && (
            <span style={{ fontSize: '.68rem', color: 'var(--accent)', fontWeight: 600, marginLeft: '.4rem' }}>
              weakest match
            </span>
          )}
        </div>
        <span className={`sug-category-badge ${elective.badge}`}>{categoryLabel}</span>
      </div>

      <div className="sug-description">{elective.description}</div>
      {isFromY9 && (
        <div className="y9-source-note">
          💡 This elective was suggested because you took a similar subject in Year 9. You can still swap it if you would like a different option.
        </div>
      )}

      <div className="sug-footer" style={{ flexWrap: 'wrap', gap: '.4rem' }}>
        <span className="sug-unit-badge"><Icon name="layers" size={12} /> 1 unit</span>

        <div style={{ display: 'flex', gap: '.35rem', alignItems: 'center', flexWrap: 'wrap', marginLeft: 'auto' }}>
          {isCompulsory && !locked && !isLangCard && (
            <span className="card-required-tag">🔒 Required slot</span>
          )}

          {/* Normal swap / locked indicator */}
          {!locked && !isLangCard
            ? <button className="dismiss-btn" onClick={onDismiss}><Icon name="refresh-cw" size={13} /> Swap</button>
            : locked
              ? <span style={{ fontSize:'.75rem', color:'var(--success)', fontWeight:600, display:'flex', alignItems:'center', gap:'.3rem' }}><Icon name="check-circle" size={13} /> Locked</span>
              : null
          }
        </div>
      </div>
    </div>
  );
}

/* ═══════════════════════════════════════════════════════════════
   PAGE 2 — EXPLORE & TRACK
═══════════════════════════════════════════════════════════════ */
const CAT_COLORS = {
  english_faculty:'#3b82f6', humanities:'#f59e0b', science:'#10b981',
  pe:'#ef4444', visual_arts:'#8b5cf6', performing_arts:'#f43f5e',
  health:'#ec4899', ict:'#14b8a6', language:'#f97316', enhancement:'#059669',
};

function Page2({ user, isGuest, activeTab, onTabChange, submittedData, checklistState, onChecklistChange, enhancements, onEnhancementSwap, onEnhancementUnswap }) {
  const [subjectFilter, setSubjectFilter] = useState('All');
  const [programYearOnly, setProgramYearOnly] = useState(false);
  const [enhSwapSlot, setEnhSwapSlot] = useState('');
  const [enhSwapSubject, setEnhSwapSubject] = useState('');

  const isUnlocked = !!submittedData;
  const suggestions = submittedData?.suggestions || [];
  const hasEnhancementSuggestion = suggestions.some(isEnhancementElective);
  const programSubjects = [...new Set(OUTSIDE_PROGRAMS.map(p => p.subject))];
  const pinnedProgramSubjects = [...new Set([
    'English',
    'Mathematics',
    ...suggestions.map(s => s?.name).filter(Boolean),
  ])];
  const protectedRequirementIds = (() => {
    const ids = new Set();
    const hum = suggestions.filter(e => HUMANITIES_IDS.includes(e.id));
    const sci = suggestions.filter(e => SCIENCE_IDS.includes(e.id));
    const pe  = suggestions.filter(e => PE_IDS.includes(e.id));
    if (hum.length <= 1 && hum[0]) ids.add(hum[0].id);
    if (sci.length <= 1 && sci[0]) ids.add(sci[0].id);
    if (pe.length <= 1 && pe[0]) ids.add(pe[0].id);
    return ids;
  })();

  const programAttendKey = (programId) => `program-attend-${programId}`;
  const isProgramEnded = (program) => {
    if (!program.endDate) return false;
    return new Date(`${program.endDate}T23:59:59`) < new Date();
  };
  const toggleProgramAttendance = (programId) => {
    const key = programAttendKey(programId);
    onChecklistChange({ ...checklistState, [key]: !checklistState[key] });
  };

  const checklistItemKey = (elective, itemKey) => `checklist-${elective.id}-${itemKey}`;

  const toggleChecklistItem = (elective, itemKey) => {
    const key = checklistItemKey(elective, itemKey);
    onChecklistChange({ ...checklistState, [key]: !checklistState[key] });
  };

  const getProgress = (elective, checklist) => {
    const allItems = [...checklist.semester1, ...checklist.semester2];
    const total = allItems.length;
    const done = allItems.filter(item => checklistState[checklistItemKey(elective, item.key)]).length;
    return { done, total, pct: total > 0 ? Math.round((done / total) * 100) : 0 };
  };

  const titles = { programs:'Outside Programs', map:'Career & Uni Map', progress:'Progress Checklist' };
  const subtitles = {
    programs:'Discover external opportunities linked to your electives.',
    map:'See how your electives connect to real careers and universities.',
    progress:'Track your milestones — keep it up! 💪',
  };

  return (
    <div className="page">
      <div className="page-header">
        <div className="page-title">{titles[activeTab] || 'Explore & Track'}</div>
        <div className="page-subtitle">{subtitles[activeTab] || ''}</div>
      </div>

      {/* SECTION A — Outside Programs */}
      {activeTab === 'programs' && (() => {
        const enrichedPrograms = OUTSIDE_PROGRAMS.map(program => {
          const attended = !!checklistState[programAttendKey(program.id)];
          const pinned = pinnedProgramSubjects.includes(program.subject);
          const ended = isProgramEnded(program);
          return { ...program, attended, pinned, ended };
        });
        const attendedCount = enrichedPrograms.filter(p => p.attended).length;
        const visiblePrograms = enrichedPrograms
          .filter(program => {
            const subjectMatches = subjectFilter === 'All' || program.subject === subjectFilter;
            const yearMatches = !programYearOnly || program.yearLevels.length === 0 || program.yearLevels.includes(10);
            return program.attended || (subjectMatches && yearMatches);
          })
          .sort((a, b) =>
            Number(b.attended) - Number(a.attended) ||
            Number(b.pinned) - Number(a.pinned) ||
            Number(a.ended) - Number(b.ended) ||
            a.subject.localeCompare(b.subject) ||
            a.title.localeCompare(b.title)
          );
        const endedVisible = visiblePrograms.filter(p => p.ended && !p.attended).length;
        const pinnedAvailable = pinnedProgramSubjects.filter(subject =>
          programSubjects.includes(subject)
        );

        return (
          <>
            <div className="program-toolbar">
              <div>
                <div className="section-label" style={{ marginBottom:'.25rem' }}>Outside opportunities</div>
                <div className="program-summary">
                  {visiblePrograms.length} shown · {attendedCount} attending · {endedVisible} ended
                </div>
              </div>
              <button
                className={`program-year-toggle${programYearOnly ? ' active' : ''}`}
                onClick={() => setProgramYearOnly(v => !v)}
              >
                <Icon name="filter" size={14} />
                {programYearOnly ? 'Showing Year 10 only' : 'Show Year 10 only'}
              </button>
            </div>

            <div className="program-pinned-strip">
              <div className="program-pinned-title">Pinned from English, Maths and your locked elective plan</div>
              <div className="program-pinned-chips">
                <button className={`filter-chip${subjectFilter==='All'?' active':''}`} onClick={() => setSubjectFilter('All')}>All</button>
                {pinnedAvailable.map(subject => (
                  <button
                    key={subject}
                    className={`filter-chip${subjectFilter===subject?' active':''}`}
                    onClick={() => setSubjectFilter(subject)}
                  >
                    {subject}
                  </button>
                ))}
              </div>
            </div>

            {hasEnhancementSuggestion && (
              <div className="enhancement-data-note">
                Enhancement subjects are included in your plan, but related outside program data has not been added yet. This section is intentionally left blank for those enhancement subjects.
              </div>
            )}

            <div className="section-label">Filter by subject</div>
            <div className="filter-chips">
              <button className={`filter-chip${subjectFilter==='All'?' active':''}`} onClick={() => setSubjectFilter('All')}>All Subjects</button>
              {programSubjects.map(subject => (
                <button
                  key={subject}
                  className={`filter-chip${subjectFilter===subject?' active':''}`}
                  onClick={() => setSubjectFilter(subject)}
                >
                  {subject}
                </button>
              ))}
            </div>

            {visiblePrograms.length === 0 ? (
              <div className="empty-programs">
                <div className="empty-programs-emoji">📬</div>
                <div className="empty-programs-text">No matching programs for this filter yet.</div>
                <div className="empty-programs-sub">Try all subjects or turn off the Year 10-only filter.</div>
              </div>
            ) : (
              <div className="program-grid">
                {visiblePrograms.map(program => {
                  const statusClass = program.attended ? 'attending' : program.ended ? 'ended' : 'open';
                  const statusText = program.attended ? 'Attending' : program.ended ? 'Ended' : program.endDate ? 'Open' : 'Date TBC';
                  return (
                    <div key={program.id} className={`program-card${program.ended ? ' ended' : ''}${program.attended ? ' attending' : ''}`}>
                      <div className="program-card-top">
                        <span className="program-subject-tag">{program.pinned && <Icon name="star" size={11} />}{program.subject}</span>
                        <span className={`program-status ${statusClass}`}>{statusText}</span>
                      </div>
                      <div className="program-title">{program.title}</div>
                      <div className="program-meta">
                        <span>{program.years}</span>
                        <span>{program.viableDate}</span>
                      </div>
                      <div className="program-desc">{program.description}</div>
                      <div className="program-actions">
                        <button
                          className={`program-attend-btn${program.attended ? ' active' : ''}`}
                          onClick={() => toggleProgramAttendance(program.id)}
                        >
                          <Icon name={program.attended ? 'check-circle' : 'circle'} size={14} />
                          {program.attended ? 'I am attending' : 'Mark attending'}
                        </button>
                        {program.link && (
                          <a className="program-link" href={program.link} target="_blank" rel="noopener noreferrer">
                            Open <Icon name="external-link" size={13} />
                          </a>
                        )}
                      </div>
                    </div>
                  );
                })}
              </div>
            )}
          </>
        );
      })()}

      {/* SECTION B — Career & Uni Map */}
      {activeTab === 'map' && (
        !isUnlocked ? (
          <div className="card"><div className="locked-overlay">
            <div className="locked-icon">🗺️</div>
            <div className="locked-title">Complete your elective profile first</div>
            <div className="locked-sub">Go to the Elective Planner, fill in your details and lock in your suggestions — then your personalised career and university pathways will appear here! 🗺️</div>
          </div></div>
        ) : (
          <>
            <div className="info-banner"><Icon name="info" size={15} /> Each of your electives maps to career pathways and universities — here are your personalised connections!</div>
            {hasEnhancementSuggestion && (
              <div className="enhancement-data-note">
                Enhancement subjects do not have career or university pathway data in the site yet, so their pathway columns are left blank for now.
              </div>
            )}
            <div className="career-map">
              <div className="map-header-row">
                <div className="map-col-title">Elective</div><div></div>
                <div className="map-col-title">Career Pathways</div><div></div>
                <div className="map-col-title">Universities</div>
              </div>
              {suggestions.map(elective => {
                const pathway = getCareerUniPathway(elective);
                const displayCareers = pathway.careers.slice(0, 2);
                const displayUnis = pathway.universities.slice(0, 2);
                return (
                  <div className="map-row" key={elective.id}>
                    <div className={`map-node elective-node ${elective.badge}`}>{elective.name}</div>
                    <div className="map-arrow-cell">→</div>
                    <div className="map-multi">
                      {displayCareers.map((c,i) => <div key={i} className="map-node career-node">{c}</div>)}
                    </div>
                    <div className="map-arrow-cell">→</div>
                    <div className="map-multi">
                      {displayUnis.slice(0,2).map((u,i) => <div key={i} className="map-node uni-node">{u}</div>)}
                    </div>
                  </div>
                );
              })}
            </div>
          </>
        )
      )}

      {/* SECTION C — Progress Checklist (redesigned) */}
      {activeTab === 'progress' && (
        !isUnlocked ? (
          <div className="card"><div className="locked-overlay">
            <div className="locked-icon">📋</div>
            <div className="locked-title">Complete your elective profile first</div>
            <div className="locked-sub">Once you lock in your electives, your progress checklist will appear here so you can track milestones! 🎯</div>
          </div></div>
        ) : (
          <>
            <div className="info-banner"><Icon name="info" size={15} /> Tick off milestones as you go — progress saves automatically! Keep it up! 💪</div>
            {hasEnhancementSuggestion && (
              <div className="enhancement-data-note">
                Enhancement subjects do not have curriculum checklist papers added yet. Their checklist is left mostly blank, with only revision tracking available.
              </div>
            )}

            {/* Enhancement swap panel */}
            {(() => {
              const activeEnhs = (enhancements || []).filter(Boolean);
              if (activeEnhs.length === 0) return null;
              return (
                <div style={{ background:'linear-gradient(135deg,#ecfdf5,#f0fdf4)', border:'1.5px solid #6ee7b7', borderRadius:'12px', padding:'1rem 1.25rem', marginBottom:'1.25rem' }}>
                  <div style={{ fontWeight:700, fontSize:'.95rem', color:'#065f46', marginBottom:'.5rem' }}>⭐ Enhancement Subject Swap</div>
                  <p style={{ fontSize:'.83rem', color:'#047857', lineHeight:1.5, marginBottom:'.75rem' }}>
                    You have selected enhancement subject(s) on the Year 11 Preview page. You can replace one of your elective slots with an enhancement subject — this will update your plan across all pages.
                  </p>
                  <div style={{ display:'flex', gap:'.6rem', flexWrap:'wrap', alignItems:'flex-end' }}>
                    <div style={{ display:'flex', flexDirection:'column', gap:'.3rem', flex:1, minWidth:'160px' }}>
                      <label style={{ fontSize:'.78rem', fontWeight:600, color:'#065f46' }}>Elective to replace</label>
                      <select className="form-select" value={enhSwapSlot} onChange={e => setEnhSwapSlot(e.target.value)}>
                        <option value="">Select a slot…</option>
                        {suggestions.map((s, i) => {
                          const protectedSlot = protectedRequirementIds.has(s.id);
                          if (isEnhancementElective(s) || protectedSlot) return null;
                          return <option key={i} value={i}>{s.name}</option>;
                        })}
                      </select>
                    </div>
                    <div style={{ display:'flex', flexDirection:'column', gap:'.3rem', flex:1, minWidth:'160px' }}>
                      <label style={{ fontSize:'.78rem', fontWeight:600, color:'#065f46' }}>Enhancement subject</label>
                      <select className="form-select" value={enhSwapSubject} onChange={e => setEnhSwapSubject(e.target.value)}>
                        <option value="">Select enhancement…</option>
                        {activeEnhs.map(s => <option key={s} value={s}>{s}</option>)}
                      </select>
                    </div>
                    <button className="btn btn-primary" style={{ background:'#10b981', whiteSpace:'nowrap' }}
                      onClick={() => {
                        if (enhSwapSlot === '' || !enhSwapSubject) return;
                        onEnhancementSwap(Number(enhSwapSlot), enhSwapSubject);
                        setEnhSwapSlot(''); setEnhSwapSubject('');
                      }}>
                      ↔ Swap
                    </button>
                  </div>
                  {suggestions.some(s => s.category === 'enhancement') && (
                    <div style={{ marginTop:'.75rem', display:'flex', flexWrap:'wrap', gap:'.45rem' }}>
                      {suggestions.map((s, i) => s.category === 'enhancement' ? (
                        <button key={i} onClick={() => onEnhancementUnswap(i)}
                          style={{ fontSize:'.78rem', padding:'.28rem .7rem', borderRadius:'99px', border:'1.5px solid #6ee7b7', background:'#d1fae5', color:'#065f46', cursor:'pointer', fontWeight:600 }}>
                          ↩ Restore slot {i+1} ({s.name})
                        </button>
                      ) : null)}
                    </div>
                  )}
                </div>
              );
            })()}

            <div className="checklist-grid">
              {suggestions.map(elective => {
                const checklist = getElectiveChecklist(elective);
                const { pct } = getProgress(elective, checklist);
                const color = CAT_COLORS[elective.category] || 'var(--primary)';
                return (
                  <div className="checklist-elective-card" key={elective.id}>
                    <div className="checklist-elective-header" style={{ background: color }}>
                      <div className="checklist-elective-name">{elective.name}</div>
                      <div className="checklist-elective-pct">{pct}%</div>
                    </div>
                    <div className="checklist-elective-bar">
                      <div className="checklist-elective-bar-fill" style={{ width:`${pct}%`, background: color }} />
                    </div>
                    <div className="checklist-elective-body">
                      {checklist.missing && (
                        <div className="checklist-missing-note">
                          {isEnhancementElective(elective)
                            ? 'Enhancement curriculum paper data has not been added yet, so this subject is left blank except for revision tracking.'
                            : CURRICULUM_MISSING_NOTE}
                        </div>
                      )}
                      <div className="checklist-semester">📘 Semester 1</div>
                      {checklist.semester1.map(item => {
                        const checked = !!checklistState[checklistItemKey(elective, item.key)];
                        return (
                          <div
                            key={item.key}
                            className={`checklist-item-v2${checked?' done':''}${item.highlight?' highlight':''}`}
                            onClick={() => toggleChecklistItem(elective, item.key)}
                          >
                            <div className={`checklist-cb${checked?' checked':''}`}>{checked && <Icon name="check" size={10} />}</div>
                            <span className="checklist-label">{item.label}</span>
                          </div>
                        );
                      })}
                      <div className="checklist-semester" style={{ marginTop:'.55rem' }}>📗 Semester 2</div>
                      {checklist.semester2.map(item => {
                        const checked = !!checklistState[checklistItemKey(elective, item.key)];
                        return (
                          <div
                            key={item.key}
                            className={`checklist-item-v2${checked?' done':''}${item.highlight?' highlight':''}`}
                            onClick={() => toggleChecklistItem(elective, item.key)}
                          >
                            <div className={`checklist-cb${checked?' checked':''}`}>{checked && <Icon name="check" size={10} />}</div>
                            <span className="checklist-label">{item.label}</span>
                          </div>
                        );
                      })}
                      {pct === 100 && (
                        <div className="checklist-complete-badge"><Icon name="award" size={14} /> All done — great work! 🎉</div>
                      )}
                    </div>
                  </div>
                );
              })}
            </div>
          </>
        )
      )}
    </div>
  );
}

      next[idx] = value;
      return next;
    });

/* ═══════════════════════════════════════════════════════════════
   APP ROOT
═══════════════════════════════════════════════════════════════ */
function App() {
  const [session, setSession] = useState(undefined); // undefined = loading
  const [isGuest, setIsGuest] = useState(false);
  const [activePage, setActivePage] = useState('page1');
  const [page2Tab, setPage2Tab] = useState('programs');
  const [showExploreDropdown, setShowExploreDropdown] = useState(false);
  const [submittedData, setSubmittedData] = useState(null);
  const [checklistState, setChecklistState] = useState({});
  const [saveFlash, setSaveFlash] = useState(false);
  const [showSettings, setShowSettings] = useState(false);
  const [userProfile, setUserProfile] = useState({ username: '', avatar_data: null });
  const [passwordRecovery, setPasswordRecovery] = useState(false);
  const [enhancements, setEnhancements] = useState(['', '']);
  const [penguinDismissed, setPenguinDismissed] = useState(false);
  const [showSchoolSplash, setShowSchoolSplash] = useState(true);

  // Debounce ref for checklist saves
  const checklistSaveTimer = useRef(null);

  useEffect(() => { if (window.feather) feather.replace(); });

  useEffect(() => {
    const timer = setTimeout(() => setShowSchoolSplash(false), 3200);
    return () => clearTimeout(timer);
  }, []);

  // Auth listener + initial session load
  useEffect(() => {
    db.auth.getSession().then(async ({ data: { session } }) => {
      setSession(session);
      if (session) {
        const [{ submittedData: sd, checklistState: cs }, prof] = await Promise.all([
          dbLoadUser(session.user.id),
          dbLoadProfile(session.user.id),
        ]);
        setSubmittedData(sd); setChecklistState(cs); setUserProfile(prof);
      }
    });

    const { data: { subscription } } = db.auth.onAuthStateChange(async (event, session) => {
      setSession(session);
      if (event === 'PASSWORD_RECOVERY') {
        setPasswordRecovery(true);
        return;
      }
      if (!session) {
        setSubmittedData(null); setChecklistState({});
        return;
      }
      // TOKEN_REFRESHED fires every ~1 min and must NOT overwrite in-memory state,
      // otherwise the enhancement banner and language swap UI disappear mid-session.
      // Only reload user data on genuine sign-in events.
      if (event === 'SIGNED_IN' || event === 'INITIAL_SESSION') {
        const [{ submittedData: sd, checklistState: cs }, prof] = await Promise.all([
          dbLoadUser(session.user.id),
          dbLoadProfile(session.user.id),
        ]);
        setSubmittedData(sd); setChecklistState(cs); setUserProfile(prof);
      }
    });

    return () => subscription.unsubscribe();
  }, []);

  const handleLogout = async () => {
    await db.auth.signOut();
    setActivePage('page1');
  };

  const handleSaveProfile = async (prof) => {
    setUserProfile(prof);
    if (user) { await dbSaveProfile(user.id, prof); showSaveIndicator(); }
  };

  const showSaveIndicator = () => {
    setSaveFlash(true);
    setTimeout(() => setSaveFlash(false), 2000);
  };

  const handleGuest = () => {
    setIsGuest(true);
    const saved = sessionStorage.getItem('elect_guest_data');
    if (saved) try { const d = JSON.parse(saved); setSubmittedData(d.sd||null); setChecklistState(d.cs||{}); } catch {}
  };

  const guestSaveData = (sd, cs) => {
    sessionStorage.setItem('elect_guest_data', JSON.stringify({ sd, cs }));
  };

  // Checklist changes: update state immediately, debounce save to Supabase
  const handleChecklistChange = useCallback((newState) => {
    setChecklistState(newState);
    if (session?.user) {
      clearTimeout(checklistSaveTimer.current);
      checklistSaveTimer.current = setTimeout(async () => {
        try {
          await dbSaveChecklist(session.user.id, newState);
        } catch (err) {
          console.error('Checklist save failed', err);
        }
        showSaveIndicator();
      }, 1200);
    } else if (isGuest) {
      guestSaveData(submittedData, newState);
    }
  }, [session, isGuest, submittedData]);

  useEffect(() => {
    setPenguinDismissed(false);
  }, [activePage, !!submittedData, submittedData?.isLocked]);

  const schoolSplash = showSchoolSplash ? (
    <div className="school-splash-overlay">
      <div className="school-neon-sign">for Mckinnon Secondary College Students!</div>
    </div>
  ) : null;

  // Loading state while checking session
  if (session === undefined && !isGuest) {
    return (
      <>
        {schoolSplash}
        <div className="loading-screen">
          <div className="spinner" />
          <div className="loading-text">Loading Elect!…</div>
        </div>
      </>
    );
  }

  // Not logged in and not guest
  if ((!session && !isGuest) || passwordRecovery) {
    return (
      <>
        {schoolSplash}
        <AuthScreen onGuest={handleGuest} recoveryMode={passwordRecovery} onRecoveryDone={() => setPasswordRecovery(false)} />
      </>
    );
  }

  const user = session?.user || null;
  const initials = user?.email?.slice(0, 2).toUpperCase() || '👤';

  const penguinMsg = (() => {
    if (activePage === 'page1') {
      if (!submittedData) return "Hi! I'm Pingu. Quick warning: my algorithm is just a rough helper, not professional advice. Fill this in, then review everything carefully!";
      if (submittedData.isLocked) return "🎉 Amazing! You're all locked in! Go check out Explore & Track and Year 11 Preview — they just unlocked!";
      return "Suggestions are here, but please don't trust them blindly. Swap, use manual choices, and only lock in once the final 8 actually feel right.";
    }
    if (activePage === 'page2') return "Welcome to Explore & Track! Check out your career paths, uni options and progress here! 🗺️";
    if (activePage === 'page3') return "This is your Year 11 preview! Click any subject area to see what's inside! 📚";
    return '';
  })();

  const handleSetSubmittedData = (data) => {
    setSubmittedData(data);
    if (isGuest) guestSaveData(data, checklistState);
  };

  const handleEnhancementSwap = async (slotIndex, enhancementName) => {
    if (!submittedData || !enhancementName) return;
    const newSugs = [...submittedData.suggestions];
    const original = newSugs[slotIndex];
    if (!original || isEnhancementElective(original)) return;
    newSugs[slotIndex] = makeEnhancementElective(enhancementName, original);
    const newData = { ...submittedData, suggestions: newSugs };
    setSubmittedData(newData);
    if (user) await dbSaveElectiveResults(user.id, { studentData: newData.studentData, suggestions: newSugs, pool: newData.pool || [], isLocked: newData.isLocked });
    else if (isGuest) guestSaveData(newData, checklistState);
    showSaveIndicator();
  };

  const handleEnhancementUnswap = async (slotIndex) => {
    if (!submittedData) return;
    const newSugs = [...submittedData.suggestions];
    const curr = newSugs[slotIndex];
    const origId = curr?._enhOriginalId;
    const original = origId ? ALL_ELECTIVES.find(e => e.id === origId) : null;
    if (!original) return;
    newSugs[slotIndex] = original;
    const newData = { ...submittedData, suggestions: newSugs };
    setSubmittedData(newData);
    if (user) await dbSaveElectiveResults(user.id, { studentData: newData.studentData, suggestions: newSugs, pool: newData.pool || [], isLocked: newData.isLocked });
    else if (isGuest) guestSaveData(newData, checklistState);
    showSaveIndicator();
  };

  return (
    <div className="app-shell" onClick={() => showExploreDropdown && setShowExploreDropdown(false)}>
      {schoolSplash}
      {isGuest && (
        <div className="guest-banner">
          👤 <strong>Guest Mode</strong> — your data will not be saved after you close this tab.
        </div>
      )}
      {showSettings && user && (
        <SettingsPanel
          user={user}
          profile={userProfile}
          onSave={handleSaveProfile}
          onClose={() => setShowSettings(false)}
        />
      )}
      <nav className="nav">
        <a className="nav-logo" href="#">
          <span className="logo-icon">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="white" strokeWidth="2.5">
              <path d="M12 2L2 7l10 5 10-5-10-5z"/>
              <path d="M2 17l10 5 10-5"/>
              <path d="M2 12l10 5 10-5"/>
            </svg>
          </span>
          Elect!
        </a>

        <div className="nav-links">
          <button className={`nav-link${activePage==='page1'?' active':''}`} onClick={() => setActivePage('page1')}>
            <Icon name="zap" size={14} /> Elective Planner
            <span style={{ marginLeft:'.3rem', fontSize:'.74rem', color: activePage==='page1'?'rgba(255,255,255,.65)':'var(--text-muted)' }}>Year 10</span>
          </button>

          {/* Explore & Track dropdown */}
          <div className="nav-dropdown-wrap" onClick={e => e.stopPropagation()}>
            <button className={`nav-link${activePage==='page2'?' active':''}`}
              onClick={() => setShowExploreDropdown(p => !p)}>
              <Icon name="compass" size={14} /> Explore &amp; Track ▾
              {!submittedData && <span className="nav-badge">2 locked</span>}
            </button>
            {showExploreDropdown && (
              <div className="nav-dropdown-menu">
                {[
                  { id:'programs', icon:'globe', label:'Outside Programs' },
                  { id:'map',      icon:'map',   label:'Career & Uni Map' },
                  { id:'progress', icon:'check-square', label:'Progress Checklist' },
                ].map(item => (
                  <button key={item.id} className={`nav-dropdown-item${page2Tab===item.id && activePage==='page2'?' active':''}`}
                    onClick={() => { setPage2Tab(item.id); setActivePage('page2'); setShowExploreDropdown(false); }}>
                    <Icon name={item.icon} size={14} /> {item.label}
                    {(item.id === 'map' || item.id === 'progress') && !submittedData && <span className="nav-badge" style={{ marginLeft:'auto' }}>🔒</span>}
                  </button>
                ))}
              </div>
            )}
          </div>

          <button className={`nav-link${activePage==='page3'?' active':''}`} onClick={() => setActivePage('page3')}>
            <Icon name="compass" size={14} /> Year 11 Preview 🔭
          </button>
        </div>

        {/* Future year levels */}
        <div style={{ display:'flex', gap:'.2rem' }}>
          {['Y9','Y11','Y12'].map(y => <button key={y} className="nav-link coming-soon" title={`${y} — coming soon`}>{y}</button>)}
        </div>

        {/* User badge */}
        <div className="nav-user">
          {saveFlash && <span className="save-indicator"><Icon name="check" size={13} /> Saved</span>}
          {user ? (
            <>
              <div className="nav-avatar" style={{ overflow:'hidden' }}>
                {userProfile.avatar_data
                  ? <img src={userProfile.avatar_data} alt="avatar" style={{ width:'100%', height:'100%', objectFit:'cover', borderRadius:'50%' }} />
                  : initials}
              </div>
              <span className="nav-email">{userProfile.username || user.email}</span>
              <button className="nav-settings-btn" title="Settings" onClick={() => setShowSettings(true)}><Icon name="settings" size={15} /></button>
              <button className="nav-logout" onClick={handleLogout}><Icon name="log-out" size={13} /> Log out</button>
            </>
          ) : (
            <>
              <span className="nav-avatar">👤</span>
              <span className="nav-email">Guest</span>
              <button className="nav-logout" onClick={() => { setIsGuest(false); sessionStorage.clear(); }}>
                <Icon name="log-out" size={13} /> Exit
              </button>
            </>
          )}
        </div>
      </nav>

      {/* Penguin guide */}
      {!penguinDismissed && (
        <div className="penguin-wrap">
          <div className="speech-bubble">{penguinMsg}</div>
          <div className="penguin-char">
            <div className="penguin-body">
              <div className="penguin-belly" />
              <div className="penguin-eye l"><div className="penguin-pupil" /></div>
              <div className="penguin-eye r"><div className="penguin-pupil" /></div>
              <div className="penguin-beak" />
              <div className="penguin-cheek l" />
              <div className="penguin-cheek r" />
              <div className="penguin-foot l" />
              <div className="penguin-foot r" />
            </div>
            <button className="penguin-dismiss" onClick={() => setPenguinDismissed(true)}>✕</button>
          </div>
        </div>
      )}

      {activePage === 'page1' && (
        <Page1
          user={user}
          isGuest={isGuest}
          submittedData={submittedData}
          onSubmit={handleSetSubmittedData}
          onSaveIndicator={showSaveIndicator}
        />
      )}
      {activePage === 'page2' && (
        <Page2
          user={user}
          isGuest={isGuest}
          activeTab={page2Tab}
          onTabChange={setPage2Tab}
          submittedData={submittedData}
          checklistState={checklistState}
          onChecklistChange={handleChecklistChange}
          enhancements={enhancements}
          onEnhancementSwap={handleEnhancementSwap}
          onEnhancementUnswap={handleEnhancementUnswap}
        />
      )}
      {activePage === 'page3' && (
        <Page3
          submittedData={submittedData}
          enhancements={enhancements}
          setEnhancements={setEnhancements}
        />
      )}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
